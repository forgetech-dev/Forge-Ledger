<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forge Ledger — Accounts</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root {
      /* Text */
      --fg: #18254f;
      --fg-soft: #4a5677;
      --muted: #8f96aa;
      --muted-faint: #c8ceda;

      /* Surfaces */
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-soft: #f3f5f9;
      --surface-inset: #eef1f6;

      /* Lines */
      --line: #ececf2;
      --line-strong: #d9dde6;

      /* Accents */
      --accent: #18254f;
      --accent-on: #ffffff;
      --positive: #3d9d36;
      --positive-soft: #eaf6e8;
      --negative: #c63d3a;
      --negative-soft: #fdecec;
      --negative-line: #f0c9c7;
      --trend: #52bb43;

      /* Tag colors */
      --tag-plaid-bg: #e7eefc;
      --tag-plaid-fg: #2d4a8a;
      --tag-snaptrade-bg: #e8f4ec;
      --tag-snaptrade-fg: #2c6d3c;

      /* Radii */
      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 28px;
      --r-pill: 999px;

      /* Shadows */
      --shadow-sm: 0 6px 18px rgba(20, 31, 56, 0.06);
      --shadow-md: 0 12px 28px rgba(20, 31, 56, 0.10);
      --shadow-lg: 0 18px 42px rgba(20, 31, 56, 0.12);
    }
    * { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-padding-top: 1rem;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: var(--fg);
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
    }

    h1 { margin: 0; font-size: 1.85rem; font-weight: 850; letter-spacing: -0.01em; color: var(--fg); }
    h2 { margin: 0; font-size: 1rem; font-weight: 750; color: var(--fg); }
    p.lead { color: var(--muted); margin: 0.4rem 0 1.1rem; font-size: 0.94rem; line-height: 1.45; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

    /* Manage / actions menu */
    .actions-menu { position: relative; flex: 0 0 auto; }
    .actions-menu summary {
      min-height: 42px;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-pill);
      color: var(--fg);
      background: var(--surface);
      cursor: pointer;
      list-style: none;
      font-size: 0.88rem;
      font-weight: 750;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
    }
    .actions-menu summary::-webkit-details-marker { display: none; }
    .actions-menu[open] summary { background: var(--surface-soft); }
    .toolbar {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
      width: min(16rem, calc(100vw - 2rem));
      padding: 0.6rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    button {
      min-height: 42px;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--fg);
      border-radius: var(--r-pill);
      touch-action: manipulation;
      transition: background 0.12s ease, opacity 0.12s ease;
    }
    button.primary { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .institutions { color: var(--muted); font-size: 0.84rem; line-height: 1.45; margin-bottom: 1rem; }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: 0.3rem;
      margin: 1rem 0 1.25rem;
      padding: 0.3rem;
      border-radius: var(--r-pill);
      background: var(--surface-soft);
    }
    .view-tab {
      flex: 1;
      border: 0;
      border-radius: var(--r-pill);
      color: var(--muted);
      background: transparent;
      font-weight: 800;
      font-size: 0.92rem;
      min-height: 38px;
      box-shadow: none;
    }
    .view-tab.active {
      color: var(--fg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .view[hidden] { display: none; }

    /* Hero charts (Net worth + Investments) */
    .chart, .invest-card {
      margin: 1.2rem 0 1.4rem;
      padding: 1.4rem 1.3rem 1.1rem;
      border-radius: var(--r-xl);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
    }
    .chart-summary, .invest-summary { text-align: center; color: var(--fg); }
    .chart-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .chart-value, .invest-value {
      margin-top: 0.55rem;
      font-size: 2.15rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }
    .chart-change, .invest-change {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.7rem;
      padding: 0.28rem 0.8rem;
      border-radius: var(--r-pill);
      background: var(--positive-soft);
      color: var(--positive);
      font-weight: 800;
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
    }
    .chart-change.down, .invest-change.down { background: var(--negative-soft); color: var(--negative); }
    .chart-date, .invest-caption {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chart-body { height: 168px; margin-top: 0.5rem; touch-action: none; cursor: crosshair; }
    .invest-chart { height: 150px; margin-top: 0.4rem; touch-action: none; cursor: crosshair; }
    .chart svg, .invest-chart svg { width: 100%; height: 100%; display: block; }
    .chart-line, .invest-line {
      fill: none;
      stroke: var(--trend);
      stroke-width: 5.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chart-line.future, .invest-line.future { stroke: var(--muted-faint); }
    .chart-marker, .invest-marker { stroke: var(--muted-faint); stroke-width: 3; stroke-linecap: round; }
    .chart-dot, .invest-dot { fill: var(--surface); stroke: var(--trend); stroke-width: 5; }
    .invest-area { fill: rgba(82, 187, 67, 0.08); }

    .chart-ranges { display: flex; justify-content: space-around; gap: 0.25rem; margin-top: 0.6rem; }
    .chart-range {
      border: 0;
      border-radius: var(--r-pill);
      padding: 0.5rem 1rem;
      color: var(--muted);
      background: transparent;
      font-size: 0.86rem;
      font-weight: 800;
      min-height: 36px;
    }
    .chart-range.active { color: var(--fg); background: var(--surface-soft); }
    .chart-empty { color: var(--muted); font-size: 0.9rem; padding: 2rem 0; text-align: center; }

    /* Account category cards (Overview) */
    .category {
      margin: 0.75rem 0;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .category summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 1.1rem;
      cursor: pointer;
      list-style: none;
      touch-action: manipulation;
    }
    .category summary::-webkit-details-marker { display: none; }
    .category[open] summary { border-bottom: 1px solid var(--line); }
    .category-main { min-width: 0; }
    .category-name { display: block; font-size: 0.98rem; font-weight: 800; color: var(--fg); }
    .category-count {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .category-body { padding: 0.5rem 0.95rem 0.85rem; }
    .category-chevron {
      width: 0.55rem;
      height: 0.55rem;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 0.15s ease;
    }
    .category[open] .category-chevron { transform: rotate(225deg); }
    .subtotal { font-weight: 850; font-variant-numeric: tabular-nums; color: var(--fg); font-size: 1rem; }
    .subtotal.debt { color: var(--negative); }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; color: var(--fg); }
    th, td { padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--line); text-align: left; }
    th {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: 0; }

    .muted { color: var(--muted); font-size: 0.82rem; }

    .tag {
      display: inline-block;
      font-size: 0.66rem;
      padding: 0.12rem 0.5rem;
      border-radius: var(--r-pill);
      background: var(--tag-plaid-bg);
      color: var(--tag-plaid-fg);
      margin-left: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .tag.snaptrade { background: var(--tag-snaptrade-bg); color: var(--tag-snaptrade-fg); }

    .networth {
      margin-top: 1.5rem;
      padding: 1.15rem 1.3rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.98rem;
      color: var(--fg);
      font-weight: 750;
    }
    .networth .amount {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      font-size: 1.4rem;
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    .err {
      color: var(--negative);
      white-space: pre-wrap;
      background: var(--negative-soft);
      border: 1px solid var(--negative-line);
      padding: 0.7rem 0.85rem;
      border-radius: var(--r-sm);
      font-size: 0.82rem;
      margin-top: 1rem;
    }

    th.actions, td.actions { width: 1%; text-align: right; white-space: nowrap; }
    button.remove {
      padding: 0.32rem 0.75rem;
      font-size: 0.78rem;
      color: var(--negative);
      background: var(--surface);
      border-color: var(--negative-line);
      min-height: 34px;
      font-weight: 750;
    }

    /* Transactions */
    .tx-search {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 1rem 0 1.25rem;
      padding: 0.8rem 1.05rem;
      border-radius: var(--r-pill);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .tx-search-icon { color: var(--muted); font-size: 1.1rem; }
    .tx-search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 0.98rem;
    }
    .tx-search input::placeholder { color: var(--muted); }
    .tx-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin: -0.4rem 0 0.85rem;
    }

    .tx-summary {
      margin: 1rem 0 1.1rem;
      padding: 1.15rem 1.25rem;
      border-radius: var(--r-lg);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .tx-summary-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tx-summary-value {
      margin-top: 0.35rem;
      color: var(--fg);
      font-size: 1.85rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .tx-summary-note {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .tx-spend-chart {
      display: flex;
      justify-content: center;
      margin: 1rem 0 0.85rem;
    }
    .tx-spend-donut {
      position: relative;
      width: min(11rem, 45vw);
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--line), var(--shadow-sm);
      touch-action: none;
    }
    .tx-spend-donut::after {
      content: "";
      position: absolute;
      inset: 24%;
      z-index: 0;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .tx-spend-center {
      position: absolute;
      inset: 31%;
      z-index: 1;
      display: grid;
      place-content: center;
      text-align: center;
    }
    .tx-spend-center-label {
      color: var(--muted);
      font-size: 0.66rem;
      font-weight: 850;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .tx-spend-center-value {
      margin-top: 0.18rem;
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .tx-spend-tooltip {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      max-width: min(12rem, 80vw);
      padding: 0.35rem 0.55rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-sm);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow-sm);
      color: var(--fg);
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, -120%);
      transition: opacity 0.12s ease;
      white-space: nowrap;
    }
    .tx-spend-tooltip.visible { opacity: 1; }

    .tx-breakdown { display: grid; gap: 0.5rem; margin-top: 1rem; }
    .tx-breakdown-group {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--surface);
    }
    .tx-breakdown-group summary {
      padding: 0.58rem 0.65rem;
      cursor: pointer;
      list-style: none;
      touch-action: manipulation;
    }
    .tx-breakdown-group summary::-webkit-details-marker { display: none; }
    .tx-breakdown-group[open] summary { border-bottom: 1px solid var(--line); }
    .tx-breakdown-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; }
    .tx-breakdown-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      color: var(--fg);
      font-size: 0.86rem;
      font-weight: 700;
    }
    .tx-breakdown-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-breakdown-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--trend); flex: 0 0 auto; }
    .tx-breakdown-amount {
      color: var(--fg);
      font-size: 0.86rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tx-breakdown-bar {
      grid-column: 1 / -1;
      height: 0.4rem;
      overflow: hidden;
      border-radius: var(--r-pill);
      background: var(--surface-inset);
    }
    .tx-breakdown-fill { height: 100%; border-radius: inherit; background: var(--trend); }
    .tx-breakdown-items {
      display: grid;
      gap: 0;
      padding: 0.15rem 0.65rem 0.6rem;
    }
    .tx-breakdown-tx {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.52rem 0;
      border-top: 1px solid var(--line);
    }
    .tx-breakdown-tx:first-child { border-top: 0; }
    .tx-breakdown-tx-name {
      min-width: 0;
      overflow: hidden;
      color: var(--fg);
      font-size: 0.84rem;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tx-breakdown-tx-sub {
      margin-top: 0.12rem;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tx-breakdown-tx-amount {
      color: var(--fg);
      font-size: 0.84rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tx-breakdown-tx-amount.inflow { color: var(--positive); }

    .tx-day {
      margin: 1.5rem 0 0.7rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tx-list { display: grid; gap: 0.55rem; }
    .tx-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.7rem 0.95rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
    }
    .tx-main { min-width: 0; }
    .tx-name {
      color: var(--fg);
      font-size: 0.96rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-sub {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .tx-pill {
      max-width: 9.5rem;
      padding: 0.22rem 0.6rem;
      border-radius: var(--r-pill);
      color: var(--positive);
      background: var(--positive-soft);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-pill.food { color: #8b35dd; background: #f2e7ff; }
    .tx-pill.transfer { color: var(--fg-soft); background: var(--surface-inset); }
    .tx-pill.shopping { color: #b56b0a; background: #fff0d9; }
    .tx-pill.travel { color: #1d72b8; background: #e6f3ff; }
    .tx-amount {
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tx-amount.inflow { color: var(--positive); }
    .tx-dot {
      display: inline-block;
      width: 0.42rem;
      height: 0.42rem;
      margin-left: 0.4rem;
      border-radius: 50%;
      background: var(--muted-faint);
      vertical-align: middle;
    }
    .tx-empty { margin: 2rem 0; color: var(--muted); text-align: center; }

    /* Investments specifics */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin: 1.4rem 0 0.7rem;
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 800;
    }
    .section-subtitle {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .alloc-card {
      padding: 1rem 1.05rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .alloc-layout {
      display: grid;
      grid-template-columns: 12rem minmax(0, 1fr);
      gap: 1rem;
      align-items: center;
    }
    .alloc-donut {
      position: relative;
      width: min(12rem, 42vw);
      aspect-ratio: 1;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px var(--line), var(--shadow-sm);
    }
    .alloc-donut::after {
      content: "";
      position: absolute;
      inset: 22%;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .alloc-center {
      position: absolute;
      inset: 29%;
      z-index: 1;
      display: grid;
      place-content: center;
      text-align: center;
    }
    .alloc-center-label {
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .alloc-center-value {
      margin-top: 0.18rem;
      color: var(--fg);
      font-size: 1rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }
    .alloc-legend {
      display: grid;
      gap: 0.55rem;
      min-width: 0;
    }
    .alloc-legend-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.55rem;
      align-items: center;
      color: var(--fg);
      font-size: 0.92rem;
      font-weight: 750;
    }

</head>

<script>
const out = document.getElementById("out");
const instEl = document.getElementById("institutions");
const chartEl = document.getElementById("chart");
const actionsMenu = document.getElementById("actions-menu");
const removeModeBtn = document.getElementById("remove-mode");
const overviewView = document.getElementById("overview-view");
const transactionsView = document.getElementById("transactions-view");
const investmentsView = document.getElementById("investments-view");
const marketView = document.getElementById("market-view");
const overviewTab = document.getElementById("overview-tab");
const investmentsTab = document.getElementById("investments-tab");
const transactionsTab = document.getElementById("transactions-tab");
const marketTab = document.getElementById("market-tab");
const txSummary = document.getElementById("tx-summary");
const txSearch = document.getElementById("tx-search");
const txOut = document.getElementById("tx-out");
const exportTransactionsBtn = document.getElementById("export-transactions");
const investCard = document.getElementById("invest-card");
const investOut = document.getElementById("invest-out");
const marketHero = document.getElementById("market-hero");
const marketOut = document.getElementById("market-out");
let removeMode = false;
let chartRange = "1M";
let investmentChartRange = "1M";
let chartHistory = [];
let openCategories = new Set();
let currentView = "overview";
let transactionsData = [];
let investmentsData = null;
let marketPulseData = null;

function fmt(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString(undefined, { style: "currency", currency: "USD" });
}

function fmtShort(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString(undefined, {
    style: "currency",
    currency: "USD",
    notation: "compact",
    maximumFractionDigits: 1,
  });
}

function freshness(bal) {
  if (!bal.fetched_at) return "Cache warming up.";
  const when = new Date(bal.fetched_at * 1000).toLocaleString();
  return bal.from_cache ? `Last updated ${when}.` : `Refreshed ${when}.`;
}

function fmtDate(dateStr) {
  return new Date(`${dateStr}T00:00:00`).toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric",
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}

function txDateLabel(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if (d.getTime() === today.getTime()) return "Today";
  if (d.getTime() === yesterday.getTime()) return "Yesterday";
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "long",
    day: "numeric",
  });
}

function txCategoryClass(category) {
  const c = displayCategory(category).toLowerCase();
  if (c.includes("restaurant") || c.includes("food") || c.includes("grocery")) return "food";
  if (c.includes("transfer") || c.includes("payment") || c.includes("loan")) return "transfer";
  if (c.includes("shop") || c.includes("merchandise")) return "shopping";
  if (c.includes("travel") || c.includes("transport")) return "travel";
  return "";
}

function isThisMonth(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function isInternalPayment(tx) {
  const primary = String(tx.category_primary || "").toUpperCase();
  const detailed = String(tx.category_detailed || "").toUpperCase();
  const category = String(tx.category || "").toLowerCase();
  const name = String(tx.name || "").toLowerCase();
  return (
    primary.startsWith("TRANSFER") ||
    primary === "LOAN_PAYMENTS" ||
    detailed.includes("ACCOUNT_TRANSFER") ||
    detailed.includes("CREDIT_CARD_PAYMENT") ||
    category.includes("transfer") ||
    category.includes("credit card payment") ||
    category.includes("loan payment") ||
    name.includes("credit crd autopay") ||
    name.includes("automatic payment") ||
    name.includes("payment - thank")
  );
}

const spendingCategories = {
  "Household": { emoji: "🏠", color: "#f06b2f" },
  "Other": { emoji: "🤷", color: "#343844" },
  "Entertainment": { emoji: "🎟️", color: "#38a93a" },
  "Groceries": { emoji: "🥑", color: "#52bb43" },
  "Restaurants": { emoji: "🍔", color: "#8b21e8" },
  "Food & Drink": { emoji: "🍷", color: "#9b59b6" },
  "Car": { emoji: "🚗", color: "#49b7ad" },
  "Subscriptions": { emoji: "💳", color: "#d82ec6" },
  "Shops": { emoji: "🛍️", color: "#d91f2a" },
  "Insurance": { emoji: "☂️", color: "#c1ba28" },
  "Loans": { emoji: "💰", color: "#4324e8" },
  "Personal Care": { emoji: "✂️", color: "#8c9d24" },
  "Travel & Vacation": { emoji: "🏖️", color: "#c6a227" },
  "Work Expenses": { emoji: "💼", color: "#b77a2c" },
};
const spendingCategoryOrder = Object.keys(spendingCategories);

function spendingCategoryForTx(tx) {
  const detailed = displayCategory(tx.category).toLowerCase();
  const primary = String(tx.category_primary || "").toLowerCase();
  const plaidDetailed = String(tx.category_detailed || "").toLowerCase();
  const name = String(tx.name || "").toLowerCase();
  const text = [detailed, primary, plaidDetailed, name].join(" ");

  if (text.includes("rent") || text.includes("mortgage") || text.includes("utilities") || text.includes("home")) return "Household";
  if (text.includes("insurance")) return "Insurance";
  if (text.includes("loan")) return "Loans";
  if (text.includes("flight") || text.includes("hotel") || text.includes("travel") || text.includes("vacation")) return "Travel & Vacation";
  if (text.includes("transport") || text.includes("parking") || text.includes("gas") || text.includes("fuel") || text.includes("taxi") || text.includes("rideshare") || text.includes("uber") || text.includes("lyft") || text.includes("car")) return "Car";
  if (text.includes("spotify") || text.includes("netflix") || text.includes("hulu") || text.includes("youtube") || text.includes("subscription") || text.includes("recurring") || text.includes("apple.com/bill") || text.includes("anthropic") || text.includes("claude") || text.includes("openai") || text.includes("adobe") || text.includes("github") || text.includes("music and audio")) return "Subscriptions";
  if (text.includes("grocery") || text.includes("groceries") || text.includes("supermarket")) return "Groceries";
  if (text.includes("restaurant") || text.includes("dining") || text.includes("fast food") || text.includes("coffee") || text.includes("cafe")) return "Restaurants";
  if (text.includes("food") || text.includes("beer") || text.includes("wine") || text.includes("liquor")) return "Food & Drink";
  if (text.includes("shop") || text.includes("shopping") || text.includes("merchandise") || text.includes("superstore") || text.includes("costco") || text.includes("amazon") || text.includes("target") || text.includes("walmart")) return "Shops";
  if (text.includes("entertainment") || text.includes("sporting") || text.includes("amusement") || text.includes("museum") || text.includes("movie")) return "Entertainment";
  if (text.includes("personal care") || text.includes("hair") || text.includes("spa") || text.includes("salon")) return "Personal Care";
  if (text.includes("office") || text.includes("business") || text.includes("work expense")) return "Work Expenses";
  return "Other";
}

function categoryColor(category) {
  if (spendingCategories[category]) return spendingCategories[category].color;
  const colors = ["#52bb43", "#8b35dd", "#1d72b8", "#b56b0a", "#d84b8a", "#61708a"];
  let hash = 0;
  for (const char of displayCategory(category)) hash = (hash + char.charCodeAt(0)) % colors.length;
  return colors[hash];
}

function categoryEmoji(category) {
  if (spendingCategories[category]) return spendingCategories[category].emoji;
  const c = displayCategory(category).toLowerCase();
  if (c.includes("restaurant") || c.includes("food") || c.includes("dining")) return "🍔";
  if (c.includes("grocery")) return "🥑";
  if (c.includes("entertainment")) return "🎟️";
  if (c.includes("travel") || c.includes("flight") || c.includes("hotel")) return "✈️";
  if (c.includes("transport") || c.includes("gas") || c.includes("parking")) return "🚗";
  if (c.includes("shop") || c.includes("merchandise")) return "🛍️";
  if (c.includes("health") || c.includes("medical")) return "🏥";
  if (c.includes("rent") || c.includes("home") || c.includes("utilities")) return "🏠";
  if (c.includes("transfer") || c.includes("payment")) return "↔️";
  if (c.includes("income") || c.includes("payroll")) return "💵";
  if (c.includes("subscription")) return "🔁";
  if (c.includes("education")) return "🎓";
  if (c.includes("loan") || c.includes("bank fee")) return "🏦";
  return "•";
}

function displayCategory(category) {
  const c = String(category || "Uncategorized");
  const lower = c.toLowerCase();
  if (lower === "general merchandise superstores") return "Shopping";
  if (
    lower.includes("transport") ||
    lower.includes("taxi") ||
    lower.includes("ride share") ||
    lower.includes("rideshare") ||
    lower.includes("parking") ||
    lower.includes("gas") ||
    lower.includes("fuel") ||
    lower.includes("public transit")
  ) return "Transportation";
  return c;
}

function isManshiRentReimbursement(tx) {
  const name = String(tx.name || "").toLowerCase();
  return Number(tx.amount || 0) < 0 && name.includes("manshi");
}

function sortSpendingBreakdown(items) {
  return items.sort((a, b) => {
    const aIndex = spendingCategoryOrder.indexOf(a.category);
    const bIndex = spendingCategoryOrder.indexOf(b.category);
    const left = aIndex === -1 ? spendingCategoryOrder.length : aIndex;
    const right = bIndex === -1 ? spendingCategoryOrder.length : bIndex;
    return left - right || b.amount - a.amount;
  });
}

function monthlySpendingData() {
  const monthTransactions = transactionsData.filter(tx => isThisMonth(tx.date));
  const spending = monthTransactions.filter(tx =>
    Number(tx.amount) > 0 && !isInternalPayment(tx)
  );
  const excluded = monthTransactions.filter(tx =>
    Number(tx.amount) > 0 && isInternalPayment(tx)
  );
  const categories = new Map();
  for (const tx of spending) {
    const category = spendingCategoryForTx(tx);
    if (!categories.has(category)) categories.set(category, { category, amount: 0, transactions: [] });
    const item = categories.get(category);
    item.amount += Number(tx.amount || 0);
    item.transactions.push(tx);
  }

  const reimbursements = monthTransactions
    .filter(isManshiRentReimbursement)
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  const reimbursementTotal = reimbursements.reduce((sum, tx) => sum + Math.abs(Number(tx.amount || 0)), 0);
  const adjustments = [];
  if (reimbursementTotal > 0 && categories.has("Household")) {
    const household = categories.get("Household");
    const applied = Math.min(household.amount, reimbursementTotal);
    household.amount -= applied;
    household.transactions.push({
      adjustment: true,
      date: reimbursements[0]?.date || "",
      name: "Manshi rent reimbursement",
      amount: -applied,
      category: "Rent reimbursement",
      institution: "Zelle",
      account_name: "Shared rent",
    });
    adjustments.push({
      name: "Manshi rent reimbursement",
      category: "Household",
      amount: applied,
      source_count: reimbursements.length,
    });
  }

  const breakdown = sortSpendingBreakdown(
    [...categories.values()]
      .filter(item => item.amount > 0.01)
      .map(item => ({
        ...item,
        transactions: item.transactions
          .slice()
          .sort((a, b) => String(b.date || "").localeCompare(String(a.date || ""))),
      }))
  );
  const total = breakdown.reduce((sum, item) => sum + item.amount, 0);
  return { monthTransactions, spending, excluded, adjustments, total, breakdown };
}

function setupSpendDonutInteractions() {
  const donut = txSummary.querySelector(".tx-spend-donut");
  if (!donut) return;
  const tooltip = donut.querySelector(".tx-spend-tooltip");
  let segments = [];
  try {
    segments = JSON.parse(donut.dataset.segments || "[]");
  } catch {
    segments = [];
  }
  if (!tooltip || !segments.length) return;

  function segmentFromPoint(clientX, clientY) {
    const rect = donut.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const dx = clientX - centerX;
    const dy = clientY - centerY;
    const angle = (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
    const pct = angle / 3.6;
    return segments.find(segment => pct >= segment.start && pct <= segment.end) || segments[segments.length - 1];
  }

  function showTooltip(event) {
    const segment = segmentFromPoint(event.clientX, event.clientY);
    if (!segment) return;
    const rect = donut.getBoundingClientRect();
    const x = Math.min(Math.max(event.clientX - rect.left, 16), rect.width - 16);
    const y = Math.min(Math.max(event.clientY - rect.top, 16), rect.height - 16);
    const percent = Number(segment.percent || 0).toFixed(1);
    tooltip.textContent = `${categoryEmoji(segment.category)} ${segment.category}: ${fmt(segment.amount)} (${percent}%)`;
    tooltip.style.left = `${x}px`;
    tooltip.style.top = `${y}px`;
    tooltip.classList.add("visible");
  }

  function hideTooltip() {
    tooltip.classList.remove("visible");
  }

  donut.addEventListener("pointerdown", (event) => {
    donut.setPointerCapture?.(event.pointerId);
    showTooltip(event);
  });
  donut.addEventListener("pointermove", showTooltip);
  donut.addEventListener("pointerleave", (event) => {
    if (event.pointerType === "mouse") hideTooltip();
  });
  donut.addEventListener("pointercancel", hideTooltip);
  donut.addEventListener("blur", hideTooltip);
}

function renderMonthlySpendSummary() {
  const { spending, excluded, adjustments, total, breakdown } = monthlySpendingData();
  const spendChartHtml = breakdown.length && total > 0
    ? (() => {
        let cursor = 0;
        const segments = [];
        const gradient = breakdown.map(({ category, amount }, index) => {
          const start = cursor;
          const end = index === breakdown.length - 1 ? 100 : cursor + (amount / total) * 100;
          cursor = end;
          segments.push({
            category,
            amount,
            percent: (amount / total) * 100,
            start,
            end,
          });
          return `${categoryColor(category)} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
        }).join(", ");
        return `
          <div class="tx-spend-chart">
            <div class="tx-spend-donut" style="background: conic-gradient(${gradient});" role="img" aria-label="Monthly spending by category" tabindex="0" data-segments="${escapeHtml(JSON.stringify(segments))}">
              <div class="tx-spend-center">
                <div class="tx-spend-center-label">Spent</div>
                <div class="tx-spend-center-value">${fmtShort(total)}</div>
              </div>
              <div class="tx-spend-tooltip"></div>
            </div>
          </div>`;
      })()
    : "";
  const breakdownHtml = breakdown.length
    ? `<div class="tx-breakdown">
        ${breakdown.map(({ category, amount, transactions }) => {
          const pct = total ? Math.max(2, (amount / total) * 100) : 0;
          const color = categoryColor(category);
          const txList = (transactions || []).map(tx => {
            const account = [tx.institution, tx.account_name].filter(Boolean).join(" &middot; ");
            const detailedCategory = displayCategory(tx.category);
            const originalCategory = tx.adjustment ? "Rent reimbursement" : detailedCategory !== category ? detailedCategory : "";
            const meta = [
              tx.date ? fmtDate(tx.date) : "",
              account,
              originalCategory,
            ].filter(Boolean).map(escapeHtml).join(" &middot; ");
            const isAdjustment = Boolean(tx.adjustment);
            const amount = `${isAdjustment ? "-" : ""}${fmt(Math.abs(Number(tx.amount) || 0))}`;
            return `
              <div class="tx-breakdown-tx">
                <div>
                  <div class="tx-breakdown-tx-name">${escapeHtml(tx.name || "Transaction")}</div>
                  <div class="tx-breakdown-tx-sub">${meta}</div>
                </div>
                <div class="tx-breakdown-tx-amount ${isAdjustment ? "inflow" : ""}">${amount}</div>
              </div>`;
          }).join("");
          return `
            <details class="tx-breakdown-group">
              <summary>
                <div class="tx-breakdown-row">
                  <div class="tx-breakdown-label">
                    <span class="tx-breakdown-dot" style="background:${color}"></span>
                    <span class="tx-breakdown-name">${categoryEmoji(category)} ${escapeHtml(category)}</span>
                  </div>
                  <div class="tx-breakdown-amount">${fmt(amount)}</div>
                  <div class="tx-breakdown-bar">
                    <div class="tx-breakdown-fill" style="width:${pct.toFixed(1)}%; background:${color}"></div>
                  </div>
                </div>
              </summary>
              <div class="tx-breakdown-items">${txList}</div>
            </details>`;
        }).join("")}
      </div>`
    : "";
  const now = new Date();
  const monthName = now.toLocaleDateString(undefined, { month: "long" });
  const adjustmentNote = adjustments.length
    ? ` Manshi rent reimbursement ${fmt(adjustments.reduce((sum, item) => sum + item.amount, 0))} subtracted from Household.`
    : "";
  txSummary.innerHTML = `
    <div class="tx-summary-label">${escapeHtml(monthName)} spending</div>
    <div class="tx-summary-value">${fmt(total)}</div>
    <div class="tx-summary-note">
      ${spending.length} spending transaction${spending.length === 1 ? "" : "s"} counted.
      ${excluded.length} transfer/payment transaction${excluded.length === 1 ? "" : "s"} excluded to avoid double counting card payments.
      ${adjustmentNote}
    </div>
    ${spendChartHtml}
    ${breakdownHtml}`;
  setupSpendDonutInteractions();
}

function renderTransactions() {
  renderMonthlySpendSummary();
  const q = txSearch.value.trim().toLowerCase();
  const filtered = transactionsData.filter((t) => {
    if (!q) return true;
    return [
      t.name,
      t.category,
      t.institution,
      t.account_name,
      t.account_subtype,
    ].some(value => String(value || "").toLowerCase().includes(q));
  });

  if (!filtered.length) {
    txOut.innerHTML = `<div class="tx-empty">${transactionsData.length ? "No matching transactions." : "No transactions yet. Try Refresh from Manage."}</div>`;
    return;
  }

  let html = "";
  let currentDate = "";
  for (const tx of filtered) {
    if (tx.date !== currentDate) {
      currentDate = tx.date;
      html += `<div class="tx-day">${escapeHtml(txDateLabel(currentDate))}</div><div class="tx-list">`;
    }
    const isInflow = Number(tx.amount) < 0;
    const amount = fmt(Math.abs(Number(tx.amount) || 0));
    const pending = tx.pending ? `<span class="tx-dot" title="Pending"></span>` : "";
    const account = [tx.institution, tx.account_name, tx.account_mask ? `••${tx.account_mask}` : ""]
      .filter(Boolean)
      .join(" · ");
    html += `
      <div class="tx-row">
        <div class="tx-main">
          <div class="tx-name">${escapeHtml(tx.name)}</div>
          <div class="tx-sub">${escapeHtml(account)}</div>
        </div>
        <div class="tx-meta">
          <span class="tx-pill ${txCategoryClass(tx.category)}">${categoryEmoji(tx.category)} ${escapeHtml(displayCategory(tx.category))}</span>
          <span class="tx-amount ${isInflow ? "inflow" : ""}">${isInflow ? "+" : ""}${amount}${pending}</span>
        </div>
      </div>`;

    const next = filtered[filtered.indexOf(tx) + 1];
    if (!next || next.date !== currentDate) html += `</div>`;
  }
  txOut.innerHTML = html;
}

async function refreshTransactions(force = false) {
  const path = force ? "/api/transactions?refresh=1" : "/api/transactions";
  const payload = await fetch(path).then(r => r.json());
  if (payload.error) {
    txOut.innerHTML = `<pre class="err">${JSON.stringify(payload, null, 2)}</pre>`;
    return;
  }
  transactionsData = payload.transactions || [];
  renderTransactions();
  if ((payload.errors || []).length) {
    txOut.innerHTML += `<pre class="err">${JSON.stringify(payload.errors, null, 2)}</pre>`;
  }
}

function showView(view) {
  currentView = view;
  const showTransactions = view === "transactions";
  const showInvestments = view === "investments";
  const showMarket = view === "market";
  overviewView.hidden = showTransactions || showInvestments || showMarket;
  transactionsView.hidden = !showTransactions;
  investmentsView.hidden = !showInvestments;
  marketView.hidden = !showMarket;
  overviewTab.classList.toggle("active", view === "overview");
  investmentsTab.classList.toggle("active", showInvestments);

  if (showTransactions && transactionsData.length === 0) refreshTransactions();
  if (showInvestments && !investmentsData) refreshInvestments();
  if (showMarket && !marketPulseData) refreshMarketPulse();
}

function scaledPointsFromValues(values, width, height, pad = 10) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const spread = max - min || 1;
  return values.map((value, i) => {
    const x = values.length === 1 ? width / 2 : (i / (values.length - 1)) * width;
    const y = pad + ((max - value) / spread) * (height - pad * 2);
    return { x, y };
  });
}

function pathFromValues(values, width, height, pad = 10) {
  return scaledPointsFromValues(values, width, height, pad)
    .map((point, i) => `${i === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
    .join(" ");
}

function localIsoDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function syntheticInvestmentSeries(total) {
  const days = 7;
  const target = Number(total || 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const series = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - (days - 1 - i));
    series.push({ date: localIsoDate(d), total_value: target });
  }
  return series;
}

function investmentChartSeries(data, total) {
  const history = (data.history || [])
    .filter(point => point && point.date && Number.isFinite(Number(point.total_value)))
    .map(point => ({ date: String(point.date), total_value: Number(point.total_value) }))
    .sort((a, b) => a.date.localeCompare(b.date));
  return history.length >= 2 ? history : syntheticInvestmentSeries(total);
}

function visibleInvestmentSeries(data, total) {
  const allPoints = investmentChartSeries(data, total);
  const latest = allPoints[allPoints.length - 1];
  if (!latest) return [];
  const latestDate = new Date(`${latest.date}T00:00:00`);
  const rangeDays = { "1W": 7, "1M": 31, "3M": 92, "1Y": 366 };
  const start = new Date(latestDate);
  if (investmentChartRange === "YTD") {
    start.setMonth(0, 1);
  } else {
    start.setDate(start.getDate() - (rangeDays[investmentChartRange] || 31) + 1);
  }
  const points = allPoints.filter(point => new Date(`${point.date}T00:00:00`) >= start);
  return points.length ? points : allPoints.slice(-1);
}

function isUnvestedStockGrantHolding(row) {
  const text = [
    row?.name,
    row?.account_name,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return (
    text.includes("stock plan") &&
    (text.includes("ffiv") || text.includes("f5")) &&
    Number(row?.quantity || 0) > 200 &&
    Number(row?.value || 0) > 50000
  );
}

function isBuyingPowerHolding(row) {
  const symbol = String(holdingText(row?.symbol, "")).toUpperCase();
  const text = [
    holdingText(row?.symbol, ""),
    holdingNameText(row?.name, ""),
    row?.asset_type,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return (
    symbol === "USD" ||
    symbol === "CUR:USD" ||
    symbol === "FDLXX" ||
    symbol === "SPAXX" ||
    symbol.startsWith("CUR:") ||
    text.includes("u s dollar") ||
    text.includes("buying power") ||
    text.includes("money market") ||
    text.includes("treasury only money") ||
    text.includes("government money market")
  );
}

function investmentAccountKey(source, institution, accountName) {
  return [source || "", institution || "", accountName || ""].join("|");
}

function isStockPlanAccount(row) {
  const text = [
    row?.name,
    row?.subtype,
    row?.account_name,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return text.includes("stock plan");
}

function reconciledStockPlanPosition(value, price, fallbackQuantity) {
  const currentValue = Number(value || 0);
  const brokerPrice = Number(price || 0);
  if (currentValue > 0 && brokerPrice > 0) {
    const quantity = currentValue / brokerPrice;
    const roundedQuantity = Math.round(quantity);
    if (roundedQuantity > 0) {
      return {
        quantity: roundedQuantity,
        price: currentValue / roundedQuantity,
      };
    }
    return { quantity, price: brokerPrice };
  }
  return { quantity: fallbackQuantity, price: brokerPrice > 0 ? brokerPrice : null };
}

function reconcileStockPlanHoldings(accounts, holdings) {
  const accountValues = new Map();
  for (const account of accounts) {
    if (!isStockPlanAccount(account)) continue;
    const key = investmentAccountKey(account.source, account.institution, account.name);
    accountValues.set(key, Number(account.current || 0));
  }
  const used = new Set();
  return holdings.flatMap(holding => {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    const accountValue = accountValues.get(key) || 0;
    if (!accountValue) return [holding];
    if (used.has(key)) return [];
    used.add(key);
    const position = reconciledStockPlanPosition(accountValue, holding.price, holding.quantity);
    return [{
      ...holding,
      value: accountValue,
      quantity: position.quantity,
      price: position.price || holding.price,
    }];
  });
}

function accountsFromInvestableHoldings(accounts, holdings) {
  if (!holdings.length) return accounts;

  const totals = new Map();
  for (const holding of holdings) {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    totals.set(key, (totals.get(key) || 0) + Number(holding.value || 0));
  }

  const used = new Set();
  const displayAccounts = [];
  for (const account of accounts) {
    const key = investmentAccountKey(account.source, account.institution, account.name);
    const value = totals.get(key) || 0;
    if (value <= 0) continue;
    used.add(key);
    displayAccounts.push({ ...account, current: value });
  }

  for (const holding of holdings) {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    if (used.has(key)) continue;
    used.add(key);
    displayAccounts.push({
      institution: holding.institution,
      name: holding.account_name || holding.institution || "Investment Account",
      mask: "",
      subtype: "investment",
      current: totals.get(key) || 0,
      source: holding.source,
    });
  }

  return displayAccounts.sort((a, b) => Number(b.current || 0) - Number(a.current || 0));
}

function buyingPowerFromData(data) {
  const buyingPower = data.buying_power || {};
  const items = (buyingPower.items || [])
    .filter(item => Number(item.value || 0) > 0)
    .sort((a, b) => Number(b.value || 0) - Number(a.value || 0));
  const total = Number.isFinite(Number(buyingPower.total))
    ? Number(buyingPower.total)
    : items.reduce((sum, item) => sum + Number(item.value || 0), 0);
  return { total, items };
}

function normalizedHoldingSymbol(holding) {
  return holdingText(holding?.symbol, "").trim().toUpperCase();
}

function mergeHoldingsBySymbol(holdings) {
  const groups = new Map();
  for (const holding of holdings) {
    const symbol = normalizedHoldingSymbol(holding);
    const account = holding?.account_name || holding?.institution || "";
    const institution = holding?.institution || "";
    const key = symbol || [
      holdingNameText(holding?.name, "Holding"),
      account,
      institution,
    ].join("|").trim().toUpperCase();
    const value = Number(holding?.value || 0);
    const quantity = Number(holding?.quantity);
    const price = Number(holding?.price);
    const assetType = holding?.asset_type || "Other";
    const name = holdingNameText(holding?.name, symbol || "Holding");

    if (!groups.has(key)) {
      groups.set(key, {
        ...holding,
        symbol: symbol || holding?.symbol || "INV",
        name,
        value: 0,
        quantity: 0,
        price: Number.isFinite(price) ? price : null,
        accountNames: new Set(),
        institutions: new Set(),
        assetTypes: new Set(),
        count: 0,
      });
    }

    const group = groups.get(key);
    group.value += value;
    group.count += 1;
    if (Number.isFinite(quantity)) group.quantity += quantity;
    if (Number.isFinite(price) && price > 0 && !(Number.isFinite(group.price) && group.price > 0)) {
      group.price = price;
    }
    if (account) group.accountNames.add(account);
    if (institution) group.institutions.add(institution);
    if (assetType) group.assetTypes.add(assetType);
    if ((!Array.isArray(group.sparkline) || !group.sparkline.length) && Array.isArray(holding?.sparkline)) {
      group.sparkline = holding.sparkline;
    }
    if (name && (!group.name || name.length < String(group.name).length)) group.name = name;
  }

  return [...groups.values()].map(group => {
    const accounts = [...group.accountNames];
    const institutions = [...group.institutions];
    const assetTypes = [...group.assetTypes];
    const quantity = group.quantity > 0 ? group.quantity : group.quantity || null;
    const brokerPrice = Number(group.price);
    const fallbackPrice = quantity ? group.value / quantity : null;
    const displayPrice = Number.isFinite(brokerPrice) && brokerPrice > 0
      ? brokerPrice
      : fallbackPrice;
    return {
      ...group,
      accountNames: undefined,
      institutions: undefined,
      assetTypes: undefined,
      count: undefined,
      quantity,
      price: Number.isFinite(displayPrice) ? displayPrice : null,
      account_name: accounts.length > 1 ? `${accounts.length} accounts` : (accounts[0] || group.account_name || ""),
      institution: institutions.length > 1 ? "Multiple institutions" : (institutions[0] || group.institution || ""),
      asset_type: assetTypes.length > 1 ? "Mixed" : (assetTypes[0] || group.asset_type || "Other"),
      merged_count: group.count,
    };
  }).sort((a, b) => Number(b.value || 0) - Number(a.value || 0));
}

function displayInvestmentData(data) {
  const rawAccounts = data.accounts || [];
  const filteredHoldings = (data.holdings || []).filter(holding =>
    !isUnvestedStockGrantHolding(holding) && !isBuyingPowerHolding(holding)
  );
  const holdings = reconcileStockPlanHoldings(rawAccounts, filteredHoldings);
  const accounts = accountsFromInvestableHoldings(rawAccounts, holdings);
  const totalValue = holdings.length
    ? holdings.reduce((sum, holding) => sum + Number(holding.value || 0), 0)
    : accounts.reduce((sum, account) => sum + Number(account.current || 0), 0);
  const allocationTotals = new Map();
  for (const holding of holdings) {
    const assetType = holding.asset_type || "Other";
    allocationTotals.set(assetType, (allocationTotals.get(assetType) || 0) + Number(holding.value || 0));
  }
  const allocation = [...allocationTotals.entries()]
    .map(([asset_type, value]) => ({
      asset_type,
      value,
      percent: totalValue ? (value / totalValue) * 100 : 0,
    }))
    .filter(item => item.value > 0)
    .sort((a, b) => b.value - a.value);
  const hasFilteredHoldings = holdings.length !== (data.holdings || []).length;
  const history = data.history || [];
  const latestHistory = history[history.length - 1];
  const historyMatchesTotal = latestHistory
    && Math.abs(Number(latestHistory.total_value || 0) - totalValue) < 1;

  return {
    ...data,
    accounts,
    holdings: mergeHoldingsBySymbol(holdings),
    allocation,
    buying_power: buyingPowerFromData(data),
    total_value: totalValue,
    history: hasFilteredHoldings || !historyMatchesTotal ? [] : history,
  };
}

function renderInvestmentCard(data) {
  const total = Number(data.total_value || 0);
  const points = visibleInvestmentSeries(data, total);
  const width = 820;
  const height = 150;
  const left = 18;
  const right = 18;
  const top = 14;
  const bottom = 14;
  const values = points.map(point => point.total_value);
  let min = Math.min(...values);
  let max = Math.max(...values);
  const spread = max - min;
  const pad = Math.max(spread * 0.22, Math.abs(max || 1) * 0.008, 1);
  min -= pad;
  max += pad;
  const xFor = (i) => points.length === 1
    ? left + (width - left - right) / 2
    : left + (i / (points.length - 1)) * (width - left - right);
  const yFor = (value) => top + ((max - value) / (max - min)) * (height - top - bottom);
  const scaled = points.map((point, i) => ({ ...point, x: xFor(i), y: yFor(point.total_value) }));
  const pathFor = (items) => items
    .map((point, i) => `${i === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
    .join(" ");
  const line = pathFor(scaled);
  const area = `${line} L ${width} ${height - 8} L 0 ${height - 8} Z`;
  const ranges = ["1W", "1M", "3M", "YTD", "1Y"]
    .map(range => `<button class="chart-range ${range === investmentChartRange ? "active" : ""}" type="button" data-invest-range="${range}">${range}</button>`)
    .join("");
  investCard.innerHTML = `
    <div class="invest-summary">
      <div class="invest-change" id="investment-chart-change"></div>
      <div class="invest-value" id="investment-chart-value"></div>
      <div class="invest-caption" id="investment-chart-date"></div>
    </div>
    <div class="invest-chart">
      <svg id="investment-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Investment balance chart">
        <path class="invest-area" d="${area}"></path>
        <path id="investment-chart-future" class="invest-line future"></path>
        <path id="investment-chart-active" class="invest-line"></path>
        <line id="investment-chart-marker" class="invest-marker" x1="0" x2="0" y1="${top}" y2="${height - bottom}"></line>
        <circle id="investment-chart-dot" class="invest-dot" cx="0" cy="0" r="6"></circle>
      </svg>
    </div>
    <div class="chart-ranges">${ranges}</div>`;

  const svg = document.getElementById("investment-chart");
  const activeLine = document.getElementById("investment-chart-active");
  const futureLine = document.getElementById("investment-chart-future");
  const marker = document.getElementById("investment-chart-marker");
  const dot = document.getElementById("investment-chart-dot");
  const valueEl = document.getElementById("investment-chart-value");
  const changeEl = document.getElementById("investment-chart-change");
  const dateEl = document.getElementById("investment-chart-date");

  function selectPoint(index) {
    const selectedIndex = Math.max(0, Math.min(index, scaled.length - 1));
    const point = scaled[selectedIndex];
    const firstValue = scaled[0].total_value;
    const change = point.total_value - firstValue;
    const pct = firstValue ? (change / firstValue) * 100 : 0;
    const isDown = change < 0;
    activeLine.setAttribute("d", pathFor(scaled.slice(0, selectedIndex + 1)));
    futureLine.setAttribute("d", selectedIndex < scaled.length - 1 ? pathFor(scaled.slice(selectedIndex)) : "");
    marker.setAttribute("x1", point.x);
    marker.setAttribute("x2", point.x);
    dot.setAttribute("cx", point.x);
    dot.setAttribute("cy", point.y);
    valueEl.textContent = fmt(point.total_value);
    changeEl.classList.toggle("down", isDown);
    changeEl.textContent = `${isDown ? "↘" : "↗"} ${Math.abs(pct).toFixed(2)}%`;
    dateEl.textContent = fmtDate(point.date);
  }

  function indexFromClientX(clientX) {
    const rect = svg.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * width;
    let bestIndex = 0;
    let bestDistance = Infinity;
    scaled.forEach((point, i) => {
      const distance = Math.abs(point.x - x);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestIndex = i;
      }
    });
    return bestIndex;
  }

  let dragging = false;
  svg.addEventListener("pointerdown", (event) => {
    dragging = true;
    svg.setPointerCapture(event.pointerId);
    selectPoint(indexFromClientX(event.clientX));
  });
  svg.addEventListener("pointermove", (event) => {
    if (dragging || event.pointerType === "mouse") {
      selectPoint(indexFromClientX(event.clientX));
    }
  });
  svg.addEventListener("pointerup", () => {
    dragging = false;
  });
  svg.addEventListener("pointercancel", () => {
    dragging = false;
  });
  investCard.querySelectorAll("[data-invest-range]").forEach(button => {
    button.addEventListener("click", () => {
      investmentChartRange = button.dataset.investRange;
      renderInvestmentCard(data);
    });
  });

  selectPoint(scaled.length - 1);
}

function sparkPointValue(point) {
  return Number(
    typeof point === "number"
      ? point
      : point?.price ?? point?.close ?? point?.value ?? point?.market_value
  );
}

function holdingSparkPoints(holding) {
  const series = holding?.sparkline || holding?.price_history || holding?.priceHistory || holding?.history || holding?.prices;
  if (!Array.isArray(series)) return [];
  return series
    .map(point => ({
      value: sparkPointValue(point),
    }))
    .filter(point => Number.isFinite(point.value));
}

function renderSpark(holding) {
  const points = holdingSparkPoints(holding);
  const values = points.map(point => point.value);
  if (values.length < 2) return "";
  const latest = values[values.length - 1];
  const first = values[0];
  const down = latest < first;
  const latestLabel = escapeHtml(`Holding one-day price history. Latest price ${fmt(latest)} per share.`);
  return `
    <span class="spark-cell" role="img" aria-label="${latestLabel}">
      <span class="spark-latest">${fmt(latest)}</span>
      <span class="spark-wrap">
        <svg class="spark ${down ? "down" : ""}" viewBox="0 0 84 30" preserveAspectRatio="none" aria-hidden="true">
          <path d="${pathFromValues(values, 84, 30, 4)}"></path>
        </svg>
      </span>
    </span>`;
}

function holdingDailyChange(holding) {
  const values = holdingSparkPoints(holding).map(point => point.value);
  if (values.length < 2) return null;
  const first = values[0];
  const latest = values[values.length - 1];
  if (!Number.isFinite(first) || !Number.isFinite(latest) || first <= 0 || latest <= 0) return null;
  const priceChange = latest - first;
  const percent = (priceChange / first) * 100;
  const quantity = Number(holding.quantity);
  const currentValue = Number(holding.value);
  let amount = null;
  if (Number.isFinite(quantity) && quantity !== 0) {
    amount = priceChange * quantity;
  } else if (Number.isFinite(currentValue) && latest !== 0) {
    amount = currentValue * (priceChange / latest);
  }
  if (!Number.isFinite(amount)) return null;
  return { amount, percent };
}

function renderHoldingValue(holding) {
  const daily = holdingDailyChange(holding);
  if (!daily) {
    return `<div class="invest-value-stack"><div class="invest-amount">${fmt(holding.value)}</div></div>`;
  }
  const down = daily.amount < 0;
  const neutral = Math.abs(daily.amount) < 0.005;
  const sign = daily.amount > 0 ? "+" : daily.amount < 0 ? "-" : "";
  const percentSign = daily.percent > 0 ? "+" : daily.percent < 0 ? "-" : "";
  return `
    <div class="invest-value-stack">
      <div class="invest-amount">${fmt(holding.value)}</div>
      <div class="invest-daily-change ${down ? "down" : neutral ? "neutral" : ""}">
        ${sign}${fmt(Math.abs(daily.amount))} (${percentSign}${Math.abs(daily.percent).toFixed(2)}%)
      </div>
    </div>`;
}

function holdingText(value, fallback = "") {
  if (value == null) return fallback;
  if (typeof value === "string") return value || fallback;
  if (typeof value === "number") return String(value);
  if (typeof value === "object") {
    return (
      holdingText(value.symbol?.symbol, "") ||
      holdingText(value.symbol?.raw_symbol, "") ||
      holdingText(value.raw_symbol, "") ||
      holdingText(value.description, "") ||
      holdingText(value.name, "") ||
      fallback
    );
  }
  return fallback;
}

function holdingNameText(value, fallback = "") {
  if (value == null) return fallback;
  if (typeof value === "string") return value || fallback;
  if (typeof value === "number") return String(value);
  if (typeof value === "object") {
    return (
      holdingNameText(value.description, "") ||
      holdingNameText(value.name, "") ||
      holdingNameText(value.symbol?.description, "") ||
      holdingNameText(value.symbol?.symbol, "") ||
      fallback
    );
  }
  return fallback;
}

function holdingAssetLabel(assetType) {
  const value = String(assetType || "Other").trim() || "Other";
  const lower = value.toLowerCase();
  if (lower === "equity" || lower.includes("stock")) return "Stock";
  if (lower === "etf") return "ETF";
  if (lower.includes("crypto")) return "Crypto";
  if (lower.includes("mutual")) return "Mutual Fund";
  if (lower.includes("option")) return "Options";
  return value;
}

function groupHoldingsByAssetType(holdings) {
  const groups = new Map();
  for (const holding of holdings) {
    const label = holdingAssetLabel(holding.asset_type);
    if (!groups.has(label)) groups.set(label, { label, value: 0, holdings: [] });
    const group = groups.get(label);
    group.value += Number(holding.value || 0);
    group.holdings.push(holding);
  }
  const order = ["Stock", "ETF", "Mutual Fund", "Crypto", "Options", "Mixed", "Other"];
  return [...groups.values()].sort((a, b) => {
    const aIndex = order.includes(a.label) ? order.indexOf(a.label) : order.length;
    const bIndex = order.includes(b.label) ? order.indexOf(b.label) : order.length;
    return aIndex - bIndex || Number(b.value || 0) - Number(a.value || 0);
  });
}

function renderHoldingRow(holding, index) {
  const symbol = holdingText(holding.symbol, "INV");
  const name = holdingNameText(holding.name, symbol || "Holding");
  const account = holding.account_name || holding.institution || "";
  const spark = renderSpark(holding);
  const assetLabel = holdingAssetLabel(holding.asset_type);
  const optionDetails = assetLabel === "Options"
    ? [
        holding.option_type,
        holding.strike_price != null && Number.isFinite(Number(holding.strike_price)) ? `${fmt(holding.strike_price)} strike` : "",
        holding.expiration_date,
        holding.quantity != null && Number.isFinite(Number(holding.quantity)) ? `${Number(holding.quantity).toLocaleString()} contract${Math.abs(Number(holding.quantity)) === 1 ? "" : "s"}` : "",
        holding.price != null && Number.isFinite(Number(holding.price)) ? `${fmt(holding.price)}/share` : "",
      ].filter(Boolean).join(" &middot; ")
    : "";
  const subtitle = [
    assetLabel,
    optionDetails,
    account,
  ].filter(Boolean).map(escapeHtml).join(" &middot; ");
  return `
    <div class="invest-row holding-row ${spark ? "with-spark" : ""}">

}

function fmtSignedPercent(value) {
  if (value == null || value === "") return "-";
  const n = Number(value);
  if (!Number.isFinite(n)) return "-";
  const sign = n > 0 ? "+" : "";
  return `${sign}${n.toFixed(2)}%`;
}

function fmtSignedNumber(value) {
  if (value == null || value === "") return "-";
  const n = Number(value);
  if (!Number.isFinite(n)) return "-";
  const sign = n > 0 ? "+" : "";
  return `${sign}${n.toFixed(2)}`;
}

function fmtMarketTimestamp(epochSeconds) {
  if (!epochSeconds) return "";
  return new Date(Number(epochSeconds) * 1000).toLocaleString(undefined, {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

function marketValueLabel(item) {
  if (item?.latest == null || item?.latest === "") return "-";
  const value = Number(item?.latest);
  if (!Number.isFinite(value)) return "-";
  if (item?.group === "volatility" && ["VIX", "VXN"].includes(String(item?.symbol || "").toUpperCase())) return value.toFixed(2);
  if (item?.group === "fx") {
    const quote = String(item?.quote_currency || "").toUpperCase();
    const digits = quote === "JPY" ? 2 : 4;
    const rate = value.toLocaleString(undefined, {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits,
    });
    return quote ? `${rate} ${quote}` : rate;
  }
  return fmt(value);
}

function marketToneClass(tone) {
  if (tone === "positive" || tone === "negative" || tone === "cautious") return tone;
  return "neutral";
}

function marketSparkValues(item) {
  const raw = item?.sparkline || item?.prices || [];
  const points = raw
    .map(point => ({
      date: String(point?.date || ""),
      close: Number(point?.close),
    }))
    .filter(point => Number.isFinite(point.close));
  const intraday = points.filter(point => point.date.includes(" "));
  if (intraday.length >= 2) {
    const latestDate = intraday
      .map(point => point.date.split(" ")[0])
      .sort()
      .at(-1);
    const session = intraday.filter(point => point.date.startsWith(latestDate));
    if (session.length >= 2) return session.map(point => point.close);
  }
  return points.map(point => point.close).slice(-2);
}

function marketSparkPath(item) {
  const values = marketSparkValues(item);
  if (values.length < 2) return "";
  return pathFromValues(values, 300, 76, 8);
}

function marketSparkDirection(item) {
  const values = marketSparkValues(item);
  if (values.length < 2) return "flat";
  return values[values.length - 1] < values[0] ? "down" : "up";
}

  marketHero.innerHTML = `

function renderMarketPulse(data) {
  marketPulseData = data;
  renderMarketHero(data);
  if (!data?.configured) {
    marketOut.innerHTML = `
      <div class="market-empty">
        Add <code>TWELVE_DATA_API_KEY</code> to your <code>.env</code> file, then restart the server to enable Market Pulse.
      </div>`;
    return;
  }
  if (data?.warming_up && !(data.instruments || []).length) {
    marketOut.innerHTML = `
      <div class="market-empty">
        Market Pulse is fetching fresh data. This can take a minute on the free API because requests are spaced out safely.
      </div>`;
    window.clearTimeout(window.marketPulseRetryTimer);
    window.marketPulseRetryTimer = window.setTimeout(() => refreshMarketPulse(false), 20000);
    return;
  }

  const instruments = data.instruments || [];
  const indices = instruments.filter(item => item.group === "index");
  const volatility = instruments.filter(item => item.group === "volatility");
  const macro = instruments.filter(item => item.group === "macro");
  const fx = instruments.filter(item => item.group === "fx");
  const rsi = indices.filter(item => Number.isFinite(Number(item.rsi)));
  const missingErrors = (data.errors || []).filter(error => !error.using_stale);
  const staleErrors = (data.errors || []).filter(error => error.using_stale);
  const missingCount = missingErrors.length;
  const missingNote = missingCount && instruments.length
    ? `<div class="market-empty">${missingCount} symbol${missingCount === 1 ? "" : "s"} unavailable on the free API right now.</div>`
    : "";
  const staleNote = staleErrors.length
    ? `<div class="market-empty">${staleErrors.length} symbol${staleErrors.length === 1 ? " is" : "s are"} using stale cached data because the live API was rate-limited.</div>`
    : "";
  const warmingNote = data?.warming_up
    ? `<div class="market-empty">Showing cached Market Pulse while a fresh refresh runs in the background.</div>`
    : "";
  const hardError = missingCount && !instruments.length
    ? `<pre class="err">${JSON.stringify(missingErrors, null, 2)}</pre>`
    : "";

  marketOut.innerHTML = [
    marketSection("Market", "Price trend", indices),
    marketSection("Momentum", "RSI", rsi, renderMarketRsiCard),
    marketSection("Volatility", "Risk gauge", volatility),
    marketSection("Macro", "Useful proxies", macro),
    marketSection("FX", "Exchange rates", fx),
    warmingNote,
    staleNote,
    missingNote,
    hardError,
  ].join("");
}

async function refreshMarketPulse(force = false) {
  marketHero.innerHTML = "";
  marketOut.innerHTML = `<div class="market-empty">Loading market pulse...</div>`;
  const path = force ? "/api/market-pulse?refresh=1" : "/api/market-pulse";
  try {

    const payload = await response.json();
    renderMarketPulse(payload);
  } catch (error) {
    marketHero.innerHTML = "";
    marketOut.innerHTML = `
      <div class="market-empty">
