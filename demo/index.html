<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Forge Ledger — Accounts</title>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <style>
    :root {
      /* Text */
      --fg: #18254f;
      --fg-soft: #4a5677;
      --muted: #8f96aa;
      --muted-faint: #c8ceda;

      /* Surfaces */
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-soft: #f3f5f9;
      --surface-inset: #eef1f6;

      /* Lines */
      --line: #ececf2;
      --line-strong: #d9dde6;

      /* Accents */
      --accent: #18254f;
      --accent-on: #ffffff;
      --positive: #3d9d36;
      --positive-soft: #eaf6e8;
      --negative: #c63d3a;
      --negative-soft: #fdecec;
      --negative-line: #f0c9c7;
      --trend: #52bb43;

      /* Tag colors */
      --tag-plaid-bg: #e7eefc;
      --tag-plaid-fg: #2d4a8a;
      --tag-snaptrade-bg: #e8f4ec;
      --tag-snaptrade-fg: #2c6d3c;

      /* Radii */
      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 22px;
      --r-xl: 28px;
      --r-pill: 999px;

      /* Shadows */
      --shadow-sm: 0 6px 18px rgba(20, 31, 56, 0.06);
      --shadow-md: 0 12px 28px rgba(20, 31, 56, 0.10);
      --shadow-lg: 0 18px 42px rgba(20, 31, 56, 0.12);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 860px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: var(--fg);
      background: var(--bg);
    }

    h1 { margin: 0; font-size: 1.85rem; font-weight: 850; letter-spacing: -0.01em; color: var(--fg); }
    h2 { margin: 0; font-size: 1rem; font-weight: 750; color: var(--fg); }
    p.lead { color: var(--muted); margin: 0.4rem 0 1.1rem; font-size: 0.94rem; line-height: 1.45; }

    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }

    /* Manage / actions menu */
    .actions-menu { position: relative; flex: 0 0 auto; }
    .actions-menu summary {
      min-height: 42px;
      padding: 0.55rem 1rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--r-pill);
      color: var(--fg);
      background: var(--surface);
      cursor: pointer;
      list-style: none;
      font-size: 0.88rem;
      font-weight: 750;
      box-shadow: var(--shadow-sm);
    }
    .actions-menu summary::-webkit-details-marker { display: none; }
    .actions-menu[open] summary { background: var(--surface-soft); }
    .toolbar {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.4rem;
      width: min(16rem, calc(100vw - 2rem));
      padding: 0.6rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow-md);
    }

    button {
      min-height: 42px;
      padding: 0.55rem 1rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--fg);
      border-radius: var(--r-pill);
      touch-action: manipulation;
      transition: background 0.12s ease, opacity 0.12s ease;
    }
    button.primary { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .institutions { color: var(--muted); font-size: 0.84rem; line-height: 1.45; margin-bottom: 1rem; }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: 0.3rem;
      margin: 1rem 0 1.25rem;
      padding: 0.3rem;
      border-radius: var(--r-pill);
      background: var(--surface-soft);
    }
    .view-tab {
      flex: 1;
      border: 0;
      border-radius: var(--r-pill);
      color: var(--muted);
      background: transparent;
      font-weight: 800;
      font-size: 0.92rem;
      min-height: 38px;
      box-shadow: none;
    }
    .view-tab.active {
      color: var(--fg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .view[hidden] { display: none; }

    /* Hero charts (Net worth + Investments) */
    .chart, .invest-card {
      margin: 1.2rem 0 1.4rem;
      padding: 1.4rem 1.3rem 1.1rem;
      border-radius: var(--r-xl);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--line);
    }
    .chart-summary, .invest-summary { text-align: center; color: var(--fg); }
    .chart-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .chart-value, .invest-value {
      margin-top: 0.55rem;
      font-size: 2.15rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
    }
    .chart-change, .invest-change {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.7rem;
      padding: 0.28rem 0.8rem;
      border-radius: var(--r-pill);
      background: var(--positive-soft);
      color: var(--positive);
      font-weight: 800;
      font-size: 0.86rem;
      font-variant-numeric: tabular-nums;
    }
    .chart-change.down, .invest-change.down { background: var(--negative-soft); color: var(--negative); }
    .chart-date, .invest-caption {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chart-body { height: 168px; margin-top: 0.5rem; touch-action: none; cursor: crosshair; }
    .invest-chart { height: 150px; margin-top: 0.4rem; touch-action: none; cursor: crosshair; }
    .chart svg, .invest-chart svg { width: 100%; height: 100%; display: block; }
    .chart-line, .invest-line {
      fill: none;
      stroke: var(--trend);
      stroke-width: 5.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chart-line.future, .invest-line.future { stroke: var(--muted-faint); }
    .chart-marker, .invest-marker { stroke: var(--muted-faint); stroke-width: 3; stroke-linecap: round; }
    .chart-dot, .invest-dot { fill: var(--surface); stroke: var(--trend); stroke-width: 5; }
    .invest-area { fill: rgba(82, 187, 67, 0.08); }

    .chart-ranges { display: flex; justify-content: space-around; gap: 0.25rem; margin-top: 0.6rem; }
    .chart-range {
      border: 0;
      border-radius: var(--r-pill);
      padding: 0.5rem 1rem;
      color: var(--muted);
      background: transparent;
      font-size: 0.86rem;
      font-weight: 800;
      min-height: 36px;
    }
    .chart-range.active { color: var(--fg); background: var(--surface-soft); }
    .chart-empty { color: var(--muted); font-size: 0.9rem; padding: 2rem 0; text-align: center; }

    /* Account category cards (Overview) */
    .category {
      margin: 0.75rem 0;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .category summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 1.1rem;
      cursor: pointer;
      list-style: none;
    }
    .category summary::-webkit-details-marker { display: none; }
    .category[open] summary { border-bottom: 1px solid var(--line); }
    .category-main { min-width: 0; }
    .category-name { display: block; font-size: 0.98rem; font-weight: 800; color: var(--fg); }
    .category-count {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .category-body { padding: 0.5rem 0.95rem 0.85rem; }
    .category-chevron {
      width: 0.55rem;
      height: 0.55rem;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 0.15s ease;
    }
    .category[open] .category-chevron { transform: rotate(225deg); }
    .subtotal { font-weight: 850; font-variant-numeric: tabular-nums; color: var(--fg); font-size: 1rem; }
    .subtotal.debt { color: var(--negative); }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; color: var(--fg); }
    th, td { padding: 0.5rem 0.5rem; border-bottom: 1px solid var(--line); text-align: left; }
    th {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: 0; }

    .muted { color: var(--muted); font-size: 0.82rem; }

    .tag {
      display: inline-block;
      font-size: 0.66rem;
      padding: 0.12rem 0.5rem;
      border-radius: var(--r-pill);
      background: var(--tag-plaid-bg);
      color: var(--tag-plaid-fg);
      margin-left: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .tag.snaptrade { background: var(--tag-snaptrade-bg); color: var(--tag-snaptrade-fg); }

    .networth {
      margin-top: 1.5rem;
      padding: 1.15rem 1.3rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.98rem;
      color: var(--fg);
      font-weight: 750;
    }
    .networth .amount {
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      font-size: 1.4rem;
      color: var(--fg);
      letter-spacing: -0.01em;
    }

    .err {
      color: var(--negative);
      white-space: pre-wrap;
      background: var(--negative-soft);
      border: 1px solid var(--negative-line);
      padding: 0.7rem 0.85rem;
      border-radius: var(--r-sm);
      font-size: 0.82rem;
      margin-top: 1rem;
    }

    th.actions, td.actions { width: 1%; text-align: right; white-space: nowrap; }
    button.remove {
      padding: 0.32rem 0.75rem;
      font-size: 0.78rem;
      color: var(--negative);
      background: var(--surface);
      border-color: var(--negative-line);
      min-height: 34px;
      font-weight: 750;
    }

    /* Transactions */
    .tx-search {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin: 1rem 0 1.25rem;
      padding: 0.8rem 1.05rem;
      border-radius: var(--r-pill);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .tx-search-icon { color: var(--muted); font-size: 1.1rem; }
    .tx-search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 0.98rem;
    }
    .tx-search input::placeholder { color: var(--muted); }

    .tx-summary {
      margin: 1rem 0 1.1rem;
      padding: 1.15rem 1.25rem;
      border-radius: var(--r-lg);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }
    .tx-summary-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tx-summary-value {
      margin-top: 0.35rem;
      color: var(--fg);
      font-size: 1.85rem;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .tx-summary-note {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .tx-breakdown { display: grid; gap: 0.5rem; margin-top: 1rem; }
    .tx-breakdown-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.75rem; align-items: center; }
    .tx-breakdown-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      color: var(--fg);
      font-size: 0.86rem;
      font-weight: 700;
    }
    .tx-breakdown-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tx-breakdown-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--trend); flex: 0 0 auto; }
    .tx-breakdown-amount {
      color: var(--fg);
      font-size: 0.86rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tx-breakdown-bar {
      grid-column: 1 / -1;
      height: 0.4rem;
      overflow: hidden;
      border-radius: var(--r-pill);
      background: var(--surface-inset);
    }
    .tx-breakdown-fill { height: 100%; border-radius: inherit; background: var(--trend); }

    .tx-day {
      margin: 1.5rem 0 0.7rem;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .tx-list { display: grid; gap: 0.55rem; }
    .tx-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.7rem 0.95rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: var(--shadow-sm);
    }
    .tx-main { min-width: 0; }
    .tx-name {
      color: var(--fg);
      font-size: 0.96rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-sub {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-meta { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
    .tx-pill {
      max-width: 9.5rem;
      padding: 0.22rem 0.6rem;
      border-radius: var(--r-pill);
      color: var(--positive);
      background: var(--positive-soft);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tx-pill.food { color: #8b35dd; background: #f2e7ff; }
    .tx-pill.transfer { color: var(--fg-soft); background: var(--surface-inset); }
    .tx-pill.shopping { color: #b56b0a; background: #fff0d9; }
    .tx-pill.travel { color: #1d72b8; background: #e6f3ff; }
    .tx-amount {
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tx-amount.inflow { color: var(--positive); }
    .tx-dot {
      display: inline-block;
      width: 0.42rem;
      height: 0.42rem;
      margin-left: 0.4rem;
      border-radius: 50%;
      background: var(--muted-faint);
      vertical-align: middle;
    }
    .tx-empty { margin: 2rem 0; color: var(--muted); text-align: center; }

    /* Investments specifics */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin: 1.4rem 0 0.7rem;
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 800;
    }
    .section-subtitle {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .alloc-card {
      padding: 1rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .alloc-row {
      display: grid;
      grid-template-columns: minmax(5.5rem, 32%) minmax(3rem, 1fr) auto;
      gap: 0.75rem;
      align-items: center;
      padding: 0.5rem 0;
      color: var(--fg);
      font-size: 0.94rem;
      font-weight: 700;
    }
    .alloc-bar {
      height: 0.36rem;
      overflow: hidden;
      border-radius: var(--r-pill);
      background: var(--surface-inset);
    }
    .alloc-fill { height: 100%; border-radius: inherit; background: var(--accent); }

    .invest-list { display: grid; gap: 0.55rem; }
    .invest-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 0.85rem;
      align-items: center;
      padding: 0.85rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .holding-row { grid-template-columns: auto minmax(0, 1fr) auto auto; }

    .buying-power {
      margin: 1.1rem 0;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .buying-power summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 0.75rem;
      align-items: center;
      padding: 1rem 1.1rem;
      cursor: pointer;
      list-style: none;
    }
    .buying-power summary::-webkit-details-marker { display: none; }
    .buying-power[open] summary { border-bottom: 1px solid var(--line); }
    .buying-power-main { min-width: 0; }
    .buying-power-title { color: var(--fg); font-size: 0.98rem; font-weight: 800; }
    .buying-power-sub { margin-top: 0.2rem; color: var(--muted); font-size: 0.76rem; font-weight: 600; }
    .buying-power-total {
      color: var(--fg);
      font-size: 1rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .buying-power-chevron {
      width: 0.55rem;
      height: 0.55rem;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 0.15s ease;
    }
    .buying-power[open] .buying-power-chevron { transform: rotate(225deg); }
    .buying-power-list { display: grid; gap: 0; padding: 0 0.4rem; }
    .buying-power-list .invest-row {
      box-shadow: none;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding: 0.7rem 0.55rem;
      background: transparent;
    }
    .buying-power-list .invest-row:first-child { border-top: 0; }

    .invest-symbol {
      min-width: 3.7rem;
      padding: 0.5rem 0.6rem;
      border-radius: var(--r-sm);
      color: var(--fg-soft);
      background: var(--surface-soft);
      text-align: center;
      font-weight: 850;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
    }
    .invest-main { min-width: 0; }
    .invest-name {
      color: var(--fg);
      font-size: 0.96rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .invest-sub {
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .invest-amount {
      color: var(--fg);
      font-size: 0.98rem;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-align: right;
    }

    .spark { width: 5.2rem; height: 1.8rem; }
    .spark path {
      fill: none;
      stroke: var(--trend);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .spark.down path { stroke: var(--negative); }

    @media (max-width: 640px) {
      body {
        max-width: none;
        margin: 0;
        padding: calc(1rem + env(safe-area-inset-top)) max(0.9rem, env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) max(0.9rem, env(safe-area-inset-left));
      }
      h1 { font-size: 1.7rem; line-height: 1.1; }
      h2 { font-size: 0.98rem; }
      p.lead { font-size: 0.92rem; line-height: 1.4; margin-bottom: 0.95rem; }
      .topbar { align-items: flex-start; }
      .actions-menu summary { min-height: 42px; padding: 0.5rem 0.85rem; }
      .toolbar { width: min(17rem, calc(100vw - 1.8rem)); }
      .toolbar button { width: 100%; min-height: 44px; padding: 0.6rem 0.7rem; }
      .institutions { font-size: 0.82rem; line-height: 1.4; margin-bottom: 0.85rem; }
      .chart, .invest-card {
        margin: 1rem -0.1rem 1.1rem;
        padding: 1.1rem 0.95rem 0.9rem;
        border-radius: var(--r-lg);
      }
      .chart-value, .invest-value { font-size: clamp(1.85rem, 8vw, 2.4rem); }
      .chart-change, .invest-change { margin-top: 0.6rem; }
      .chart-date, .invest-caption { font-size: 0.74rem; }

<body>

<script>
const out = document.getElementById("out");
const instEl = document.getElementById("institutions");
const chartEl = document.getElementById("chart");
const actionsMenu = document.getElementById("actions-menu");
const removeModeBtn = document.getElementById("remove-mode");
const overviewView = document.getElementById("overview-view");
const transactionsView = document.getElementById("transactions-view");
const investmentsView = document.getElementById("investments-view");
const overviewTab = document.getElementById("overview-tab");
const investmentsTab = document.getElementById("investments-tab");
const transactionsTab = document.getElementById("transactions-tab");
const txSummary = document.getElementById("tx-summary");
const txSearch = document.getElementById("tx-search");
const txOut = document.getElementById("tx-out");
const investCard = document.getElementById("invest-card");
const investOut = document.getElementById("invest-out");
let removeMode = false;
let chartRange = "1M";
let investmentChartRange = "1M";
let chartHistory = [];
let openCategories = new Set();
let currentView = "overview";
let transactionsData = [];
let investmentsData = null;

function fmt(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString(undefined, { style: "currency", currency: "USD" });
}

function fmtShort(n) {
  if (n == null || Number.isNaN(Number(n))) return "—";
  return Number(n).toLocaleString(undefined, {
    style: "currency",
    currency: "USD",
    notation: "compact",
    maximumFractionDigits: 1,
  });
}

function freshness(bal) {
  if (!bal.fetched_at) return "Cache warming up.";
  const when = new Date(bal.fetched_at * 1000).toLocaleString();
  return bal.from_cache ? `Last updated ${when}.` : `Refreshed ${when}.`;
}

function fmtDate(dateStr) {
  return new Date(`${dateStr}T00:00:00`).toLocaleDateString(undefined, {
    month: "short",
    day: "numeric",
    year: "numeric",
  });
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[char]));
}

function txDateLabel(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  if (d.getTime() === today.getTime()) return "Today";
  if (d.getTime() === yesterday.getTime()) return "Yesterday";
  return d.toLocaleDateString(undefined, {
    weekday: "short",
    month: "long",
    day: "numeric",
  });
}

function txCategoryClass(category) {
  const c = displayCategory(category).toLowerCase();
  if (c.includes("restaurant") || c.includes("food") || c.includes("grocery")) return "food";
  if (c.includes("transfer") || c.includes("payment") || c.includes("loan")) return "transfer";
  if (c.includes("shop") || c.includes("merchandise")) return "shopping";
  if (c.includes("travel") || c.includes("transport")) return "travel";
  return "";
}

function isThisMonth(dateStr) {
  const d = new Date(`${dateStr}T00:00:00`);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
}

function isInternalPayment(tx) {
  const primary = String(tx.category_primary || "").toUpperCase();
  const detailed = String(tx.category_detailed || "").toUpperCase();
  const category = String(tx.category || "").toLowerCase();
  const name = String(tx.name || "").toLowerCase();
  return (
    primary.startsWith("TRANSFER") ||
    primary === "LOAN_PAYMENTS" ||
    detailed.includes("ACCOUNT_TRANSFER") ||
    detailed.includes("CREDIT_CARD_PAYMENT") ||
    category.includes("transfer") ||
    category.includes("credit card payment") ||
    category.includes("loan payment") ||
    name.includes("credit crd autopay") ||
    name.includes("automatic payment") ||
    name.includes("payment - thank")
  );
}

function categoryColor(category) {
  const colors = ["#52bb43", "#8b35dd", "#1d72b8", "#b56b0a", "#d84b8a", "#61708a"];
  let hash = 0;
  for (const char of displayCategory(category)) hash = (hash + char.charCodeAt(0)) % colors.length;
  return colors[hash];
}

function categoryEmoji(category) {
  const c = displayCategory(category).toLowerCase();
  if (c.includes("restaurant") || c.includes("food") || c.includes("dining")) return "🍔";
  if (c.includes("grocery")) return "🥑";
  if (c.includes("entertainment")) return "🎟️";
  if (c.includes("travel") || c.includes("flight") || c.includes("hotel")) return "✈️";
  if (c.includes("transport") || c.includes("gas") || c.includes("parking")) return "🚗";
  if (c.includes("shop") || c.includes("merchandise")) return "🛍️";
  if (c.includes("health") || c.includes("medical")) return "🏥";
  if (c.includes("rent") || c.includes("home") || c.includes("utilities")) return "🏠";
  if (c.includes("transfer") || c.includes("payment")) return "↔️";
  if (c.includes("income") || c.includes("payroll")) return "💵";
  if (c.includes("subscription")) return "🔁";
  if (c.includes("education")) return "🎓";
  if (c.includes("loan") || c.includes("bank fee")) return "🏦";
  return "•";
}

function displayCategory(category) {
  const c = String(category || "Uncategorized");
  const lower = c.toLowerCase();
  if (lower === "general merchandise superstores") return "Shopping";
  if (
    lower.includes("transport") ||
    lower.includes("taxi") ||
    lower.includes("ride share") ||
    lower.includes("rideshare") ||
    lower.includes("parking") ||
    lower.includes("gas") ||
    lower.includes("fuel") ||
    lower.includes("public transit")
  ) return "Transportation";
  return c;
}

function renderMonthlySpendSummary() {
  const monthTransactions = transactionsData.filter(tx => isThisMonth(tx.date));
  const spending = monthTransactions.filter(tx =>
    Number(tx.amount) > 0 && !isInternalPayment(tx)
  );
  const excluded = monthTransactions.filter(tx =>
    Number(tx.amount) > 0 && isInternalPayment(tx)
  );
  const total = spending.reduce((sum, tx) => sum + Number(tx.amount || 0), 0);
  const categoryTotals = new Map();
  for (const tx of spending) {
    const category = displayCategory(tx.category);
    categoryTotals.set(category, (categoryTotals.get(category) || 0) + Number(tx.amount || 0));
  }
  const sortedCategories = [...categoryTotals.entries()]
    .map(([category, amount]) => ({ category, amount }))
    .sort((a, b) => b.amount - a.amount);
  const mainCategories = sortedCategories.slice(0, 8);
  const otherTotal = sortedCategories
    .slice(8)
    .reduce((sum, item) => sum + item.amount, 0);
  const breakdown = otherTotal > 0
    ? [...mainCategories, { category: "Other", amount: otherTotal }]
    : mainCategories;
  const breakdownHtml = breakdown.length
    ? `<div class="tx-breakdown">
        ${breakdown.map(({ category, amount }) => {
          const pct = total ? Math.max(2, (amount / total) * 100) : 0;
          const color = categoryColor(category);
          return `
            <div class="tx-breakdown-row">
              <div class="tx-breakdown-label">
                <span class="tx-breakdown-dot" style="background:${color}"></span>
                <span class="tx-breakdown-name">${categoryEmoji(category)} ${escapeHtml(category)}</span>
              </div>
              <div class="tx-breakdown-amount">${fmt(amount)}</div>
              <div class="tx-breakdown-bar">
                <div class="tx-breakdown-fill" style="width:${pct.toFixed(1)}%; background:${color}"></div>
              </div>
            </div>`;
        }).join("")}
      </div>`
    : "";
  const now = new Date();
  const monthName = now.toLocaleDateString(undefined, { month: "long" });
  txSummary.innerHTML = `
    <div class="tx-summary-label">${escapeHtml(monthName)} spending</div>
    <div class="tx-summary-value">${fmt(total)}</div>
    <div class="tx-summary-note">
      ${spending.length} spending transaction${spending.length === 1 ? "" : "s"} counted.
      ${excluded.length} transfer/payment transaction${excluded.length === 1 ? "" : "s"} excluded to avoid double counting card payments.
    </div>
    ${breakdownHtml}`;
}

function renderTransactions() {
  renderMonthlySpendSummary();
  const q = txSearch.value.trim().toLowerCase();
  const filtered = transactionsData.filter((t) => {
    if (!q) return true;
    return [
      t.name,
      t.category,
      t.institution,
      t.account_name,
      t.account_subtype,
    ].some(value => String(value || "").toLowerCase().includes(q));
  });

  if (!filtered.length) {
    txOut.innerHTML = `<div class="tx-empty">${transactionsData.length ? "No matching transactions." : "No transactions yet. Try Refresh from Manage."}</div>`;
    return;
  }

  let html = "";
  let currentDate = "";
  for (const tx of filtered) {
    if (tx.date !== currentDate) {
      currentDate = tx.date;
      html += `<div class="tx-day">${escapeHtml(txDateLabel(currentDate))}</div><div class="tx-list">`;
    }
    const isInflow = Number(tx.amount) < 0;
    const amount = fmt(Math.abs(Number(tx.amount) || 0));
    const pending = tx.pending ? `<span class="tx-dot" title="Pending"></span>` : "";
    const account = [tx.institution, tx.account_name, tx.account_mask ? `••${tx.account_mask}` : ""]
      .filter(Boolean)
      .join(" · ");
    html += `
      <div class="tx-row">
        <div class="tx-main">
          <div class="tx-name">${escapeHtml(tx.name)}</div>
          <div class="tx-sub">${escapeHtml(account)}</div>
        </div>
        <div class="tx-meta">
          <span class="tx-pill ${txCategoryClass(tx.category)}">${categoryEmoji(tx.category)} ${escapeHtml(displayCategory(tx.category))}</span>
          <span class="tx-amount ${isInflow ? "inflow" : ""}">${isInflow ? "+" : ""}${amount}${pending}</span>
        </div>
      </div>`;

    const next = filtered[filtered.indexOf(tx) + 1];
    if (!next || next.date !== currentDate) html += `</div>`;
  }
  txOut.innerHTML = html;
}

async function refreshTransactions(force = false) {
  const path = force ? "/api/transactions?refresh=1" : "/api/transactions";
  const payload = await fetch(path).then(r => r.json());
  if (payload.error) {
    txOut.innerHTML = `<pre class="err">${JSON.stringify(payload, null, 2)}</pre>`;
    return;
  }
  transactionsData = payload.transactions || [];
  renderTransactions();
  if ((payload.errors || []).length) {
    txOut.innerHTML += `<pre class="err">${JSON.stringify(payload.errors, null, 2)}</pre>`;
  }
}

function showView(view) {
  currentView = view;
  const showTransactions = view === "transactions";
  const showInvestments = view === "investments";
  overviewView.hidden = showTransactions || showInvestments;
  transactionsView.hidden = !showTransactions;
  investmentsView.hidden = !showInvestments;
  overviewTab.classList.toggle("active", view === "overview");
  investmentsTab.classList.toggle("active", showInvestments);
  transactionsTab.classList.toggle("active", showTransactions);
  if (showTransactions && transactionsData.length === 0) refreshTransactions();
  if (showInvestments && !investmentsData) refreshInvestments();
}

function scaledPointsFromValues(values, width, height, pad = 10) {
  const min = Math.min(...values);
  const max = Math.max(...values);
  const spread = max - min || 1;
  return values.map((value, i) => {
    const x = values.length === 1 ? width / 2 : (i / (values.length - 1)) * width;
    const y = pad + ((max - value) / spread) * (height - pad * 2);
    return { x, y };
  });
}

function pathFromValues(values, width, height, pad = 10) {
  return scaledPointsFromValues(values, width, height, pad)
    .map((point, i) => `${i === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
    .join(" ");
}

function localIsoDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function syntheticInvestmentSeries(total) {
  const days = 7;
  const target = Number(total || 0);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const series = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - (days - 1 - i));
    series.push({ date: localIsoDate(d), total_value: target });
  }
  return series;
}

function investmentChartSeries(data, total) {
  const history = (data.history || [])
    .filter(point => point && point.date && Number.isFinite(Number(point.total_value)))
    .map(point => ({ date: String(point.date), total_value: Number(point.total_value) }))
    .sort((a, b) => a.date.localeCompare(b.date));
  return history.length >= 2 ? history : syntheticInvestmentSeries(total);
}

function visibleInvestmentSeries(data, total) {
  const allPoints = investmentChartSeries(data, total);
  const latest = allPoints[allPoints.length - 1];
  if (!latest) return [];
  const latestDate = new Date(`${latest.date}T00:00:00`);
  const rangeDays = { "1W": 7, "1M": 31, "3M": 92, "1Y": 366 };
  const start = new Date(latestDate);
  if (investmentChartRange === "YTD") {
    start.setMonth(0, 1);
  } else {
    start.setDate(start.getDate() - (rangeDays[investmentChartRange] || 31) + 1);
  }
  const points = allPoints.filter(point => new Date(`${point.date}T00:00:00`) >= start);
  return points.length ? points : allPoints.slice(-1);
}

function isUnvestedStockGrantHolding(row) {
  const text = [
    row?.name,
    row?.account_name,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return (
    text.includes("stock plan") &&
    (text.includes("ffiv") || text.includes("f5")) &&
    Number(row?.quantity || 0) > 200 &&
    Number(row?.value || 0) > 50000
  );
}

function isBuyingPowerHolding(row) {
  const symbol = String(holdingText(row?.symbol, "")).toUpperCase();
  const text = [
    holdingText(row?.symbol, ""),
    holdingNameText(row?.name, ""),
    row?.asset_type,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return (
    symbol === "USD" ||
    symbol === "CUR:USD" ||
    symbol === "FDLXX" ||
    symbol === "SPAXX" ||
    symbol.startsWith("CUR:") ||
    text.includes("u s dollar") ||
    text.includes("buying power") ||
    text.includes("money market") ||
    text.includes("treasury only money") ||
    text.includes("government money market")
  );
}

function investmentAccountKey(source, institution, accountName) {
  return [source || "", institution || "", accountName || ""].join("|");
}

function isStockPlanAccount(row) {
  const text = [
    row?.name,
    row?.subtype,
    row?.account_name,
  ].map(value => String(value || "").toLowerCase()).join(" ");
  return text.includes("stock plan");
}

function reconcileStockPlanHoldings(accounts, holdings) {
  const accountValues = new Map();
  for (const account of accounts) {
    if (!isStockPlanAccount(account)) continue;
    const key = investmentAccountKey(account.source, account.institution, account.name);
    accountValues.set(key, Number(account.current || 0));
  }
  const used = new Set();
  return holdings.flatMap(holding => {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    const accountValue = accountValues.get(key) || 0;
    if (!accountValue) return [holding];
    if (used.has(key)) return [];
    used.add(key);
    return [{ ...holding, value: accountValue }];
  });
}

function accountsFromInvestableHoldings(accounts, holdings) {
  if (!holdings.length) return accounts;

  const totals = new Map();
  for (const holding of holdings) {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    totals.set(key, (totals.get(key) || 0) + Number(holding.value || 0));
  }

  const used = new Set();
  const displayAccounts = [];
  for (const account of accounts) {
    const key = investmentAccountKey(account.source, account.institution, account.name);
    const value = totals.get(key) || 0;
    if (value <= 0) continue;
    used.add(key);
    displayAccounts.push({ ...account, current: value });
  }

  for (const holding of holdings) {
    const key = investmentAccountKey(holding.source, holding.institution, holding.account_name);
    if (used.has(key)) continue;
    used.add(key);
    displayAccounts.push({
      institution: holding.institution,
      name: holding.account_name || holding.institution || "Investment Account",
      mask: "",
      subtype: "investment",
      current: totals.get(key) || 0,
      source: holding.source,
    });
  }

  return displayAccounts.sort((a, b) => Number(b.current || 0) - Number(a.current || 0));
}

function buyingPowerFromData(data) {
  const buyingPower = data.buying_power || {};
  const items = (buyingPower.items || [])
    .filter(item => Number(item.value || 0) > 0)
    .sort((a, b) => Number(b.value || 0) - Number(a.value || 0));
  const total = Number.isFinite(Number(buyingPower.total))
    ? Number(buyingPower.total)
    : items.reduce((sum, item) => sum + Number(item.value || 0), 0);
  return { total, items };
}

function displayInvestmentData(data) {
  const rawAccounts = data.accounts || [];
  const filteredHoldings = (data.holdings || []).filter(holding =>
    !isUnvestedStockGrantHolding(holding) && !isBuyingPowerHolding(holding)
  );
  const holdings = reconcileStockPlanHoldings(rawAccounts, filteredHoldings);
  const accounts = accountsFromInvestableHoldings(rawAccounts, holdings);
  const totalValue = holdings.length
    ? holdings.reduce((sum, holding) => sum + Number(holding.value || 0), 0)
    : accounts.reduce((sum, account) => sum + Number(account.current || 0), 0);
  const allocationTotals = new Map();
  for (const holding of holdings) {
    const assetType = holding.asset_type || "Other";
    allocationTotals.set(assetType, (allocationTotals.get(assetType) || 0) + Number(holding.value || 0));
  }
  const allocation = [...allocationTotals.entries()]
    .map(([asset_type, value]) => ({
      asset_type,
      value,
      percent: totalValue ? (value / totalValue) * 100 : 0,
    }))
    .filter(item => item.value > 0)
    .sort((a, b) => b.value - a.value);
  const hasFilteredHoldings = holdings.length !== (data.holdings || []).length;
  const history = data.history || [];
  const latestHistory = history[history.length - 1];
  const historyMatchesTotal = latestHistory
    && Math.abs(Number(latestHistory.total_value || 0) - totalValue) < 1;

  return {
    ...data,
    accounts,
    holdings,
    allocation,
    buying_power: buyingPowerFromData(data),
    total_value: totalValue,
    history: hasFilteredHoldings || !historyMatchesTotal ? [] : history,
  };
}

function renderInvestmentCard(data) {
  const total = Number(data.total_value || 0);
  const points = visibleInvestmentSeries(data, total);
  const width = 820;
  const height = 150;
  const left = 18;
  const right = 18;
  const top = 14;
  const bottom = 14;
  const values = points.map(point => point.total_value);
  let min = Math.min(...values);
  let max = Math.max(...values);
  const spread = max - min;
  const pad = Math.max(spread * 0.22, Math.abs(max || 1) * 0.008, 1);
  min -= pad;
  max += pad;
  const xFor = (i) => points.length === 1
    ? left + (width - left - right) / 2
    : left + (i / (points.length - 1)) * (width - left - right);
  const yFor = (value) => top + ((max - value) / (max - min)) * (height - top - bottom);
  const scaled = points.map((point, i) => ({ ...point, x: xFor(i), y: yFor(point.total_value) }));
  const pathFor = (items) => items
    .map((point, i) => `${i === 0 ? "M" : "L"} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`)
    .join(" ");
  const line = pathFor(scaled);
  const area = `${line} L ${width} ${height - 8} L 0 ${height - 8} Z`;
  const ranges = ["1W", "1M", "3M", "YTD", "1Y"]
    .map(range => `<button class="chart-range ${range === investmentChartRange ? "active" : ""}" type="button" data-invest-range="${range}">${range}</button>`)
    .join("");
  investCard.innerHTML = `
    <div class="invest-summary">
      <div class="invest-change" id="investment-chart-change"></div>
      <div class="invest-value" id="investment-chart-value"></div>
      <div class="invest-caption" id="investment-chart-date"></div>
    </div>
    <div class="invest-chart">
      <svg id="investment-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Investment balance chart">
        <path class="invest-area" d="${area}"></path>
        <path id="investment-chart-future" class="invest-line future"></path>
        <path id="investment-chart-active" class="invest-line"></path>
        <line id="investment-chart-marker" class="invest-marker" x1="0" x2="0" y1="${top}" y2="${height - bottom}"></line>
        <circle id="investment-chart-dot" class="invest-dot" cx="0" cy="0" r="6"></circle>
      </svg>
    </div>
    <div class="chart-ranges">${ranges}</div>`;

  const svg = document.getElementById("investment-chart");
  const activeLine = document.getElementById("investment-chart-active");
  const futureLine = document.getElementById("investment-chart-future");
  const marker = document.getElementById("investment-chart-marker");
  const dot = document.getElementById("investment-chart-dot");
  const valueEl = document.getElementById("investment-chart-value");
  const changeEl = document.getElementById("investment-chart-change");
  const dateEl = document.getElementById("investment-chart-date");

  function selectPoint(index) {
    const selectedIndex = Math.max(0, Math.min(index, scaled.length - 1));
    const point = scaled[selectedIndex];
    const firstValue = scaled[0].total_value;
    const change = point.total_value - firstValue;
    const pct = firstValue ? (change / firstValue) * 100 : 0;
    const isDown = change < 0;
    activeLine.setAttribute("d", pathFor(scaled.slice(0, selectedIndex + 1)));
    futureLine.setAttribute("d", selectedIndex < scaled.length - 1 ? pathFor(scaled.slice(selectedIndex)) : "");
    marker.setAttribute("x1", point.x);
    marker.setAttribute("x2", point.x);
    dot.setAttribute("cx", point.x);
    dot.setAttribute("cy", point.y);
    valueEl.textContent = fmt(point.total_value);
    changeEl.classList.toggle("down", isDown);
    changeEl.textContent = `${isDown ? "↘" : "↗"} ${Math.abs(pct).toFixed(2)}%`;
    dateEl.textContent = fmtDate(point.date);
  }

  function indexFromClientX(clientX) {
    const rect = svg.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * width;
    let bestIndex = 0;
    let bestDistance = Infinity;
    scaled.forEach((point, i) => {
      const distance = Math.abs(point.x - x);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestIndex = i;
      }
    });
    return bestIndex;
  }

  let dragging = false;
  svg.addEventListener("pointerdown", (event) => {
    dragging = true;
    svg.setPointerCapture(event.pointerId);
    selectPoint(indexFromClientX(event.clientX));
  });
  svg.addEventListener("pointermove", (event) => {
    if (dragging || event.pointerType === "mouse") {
      selectPoint(indexFromClientX(event.clientX));
    }
  });
  svg.addEventListener("pointerup", () => {
    dragging = false;
  });
  svg.addEventListener("pointercancel", () => {
    dragging = false;
  });
  investCard.querySelectorAll("[data-invest-range]").forEach(button => {
    button.addEventListener("click", () => {
      investmentChartRange = button.dataset.investRange;
      renderInvestmentCard(data);
    });
  });

  selectPoint(scaled.length - 1);
}

function renderSpark(value, index) {
  const base = Math.max(1, Number(value || 0));
  const values = Array.from({ length: 8 }, (_, i) =>
    base * (0.9 + i * 0.012 + Math.sin(i + index) * 0.025)
  );
  const down = index % 5 === 4;
  if (down) values.reverse();
  return `<svg class="spark ${down ? "down" : ""}" viewBox="0 0 84 30" preserveAspectRatio="none"><path d="${pathFromValues(values, 84, 30, 4)}"></path></svg>`;
}

function holdingText(value, fallback = "") {
  if (value == null) return fallback;
  if (typeof value === "string") return value || fallback;
  if (typeof value === "number") return String(value);
  if (typeof value === "object") {
    return (
      holdingText(value.symbol?.symbol, "") ||
      holdingText(value.symbol?.raw_symbol, "") ||
      holdingText(value.raw_symbol, "") ||
      holdingText(value.description, "") ||
      holdingText(value.name, "") ||
      fallback
    );
  }
  return fallback;
}

function holdingNameText(value, fallback = "") {
  if (value == null) return fallback;
  if (typeof value === "string") return value || fallback;
  if (typeof value === "number") return String(value);
  if (typeof value === "object") {
    return (
      holdingNameText(value.description, "") ||
      holdingNameText(value.name, "") ||
      holdingNameText(value.symbol?.description, "") ||
      holdingNameText(value.symbol?.symbol, "") ||
      fallback
    );
  }
  return fallback;
}

function renderNetWorthChart(history) {
  chartHistory = history || [];
  const allPoints = chartHistory
    .filter(p => p && p.date && Number.isFinite(Number(p.net_worth)))
    .map(p => ({ date: p.date, net_worth: Number(p.net_worth) }))
    .sort((a, b) => a.date.localeCompare(b.date));

  if (!allPoints.length) {
    chartEl.innerHTML = `
      <div class="chart-summary">
        <div class="chart-title">Net worth</div>
      </div>
      <div class="chart-empty">Daily net worth history will appear after the first successful refresh.</div>`;
    return;
  }

  const latestDate = new Date(`${allPoints[allPoints.length - 1].date}T00:00:00`);
  const rangeDays = { "1W": 7, "1M": 31, "3M": 92, "1Y": 366 };
  const visibleStart = new Date(latestDate);
  if (chartRange === "YTD") {
    visibleStart.setMonth(0, 1);
  } else {
    visibleStart.setDate(visibleStart.getDate() - (rangeDays[chartRange] || 31) + 1);
  }

  let points = allPoints.filter(p => new Date(`${p.date}T00:00:00`) >= visibleStart);
  if (!points.length) points = allPoints.slice(-1);

  const width = 820;
  const height = 168;
  const left = 22;
  const right = 22;
  const top = 18;
  const bottom = 20;
  const values = points.map(p => p.net_worth);
  let min = Math.min(...values);
  let max = Math.max(...values);
  const spread = max - min;
  const pad = Math.max(spread * 0.22, Math.abs(max || 1) * 0.008, 60);
  min -= pad;
  max += pad;

  const xFor = (i) => points.length === 1
    ? left + (width - left - right) / 2
    : left + (i / (points.length - 1)) * (width - left - right);
  const yFor = (value) => top + ((max - value) / (max - min)) * (height - top - bottom);
  const scaled = points.map((p, i) => ({ ...p, x: xFor(i), y: yFor(p.net_worth) }));
  const pathFor = (items) => items
    .map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)
    .join(" ");
  const ranges = ["1W", "1M", "3M", "YTD", "1Y"]
    .map(range => `<button type="button" class="chart-range ${range === chartRange ? "active" : ""}" data-chart-range="${range}">${range}</button>`)
    .join("");

  chartEl.innerHTML = `
    <div class="chart-summary">
      <div class="chart-title">Net worth</div>
      <div class="chart-value" id="chart-value"></div>
      <div class="chart-change" id="chart-change"></div>
      <div class="chart-date" id="chart-date"></div>
    </div>
    <div class="chart-body">
      <svg id="networth-chart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="Net worth history chart">
        <path id="chart-future" class="chart-line future"></path>
        <path id="chart-active" class="chart-line"></path>
        <line id="chart-marker" class="chart-marker" x1="0" x2="0" y1="${top}" y2="${height - bottom}"></line>
        <circle id="chart-dot" class="chart-dot" cx="0" cy="0" r="6"></circle>
      </svg>
    </div>
    <div class="chart-ranges">${ranges}</div>`;

  const svg = document.getElementById("networth-chart");
  const activeLine = document.getElementById("chart-active");
  const futureLine = document.getElementById("chart-future");
  const marker = document.getElementById("chart-marker");
  const dot = document.getElementById("chart-dot");
  const valueEl = document.getElementById("chart-value");
  const changeEl = document.getElementById("chart-change");
  const dateEl = document.getElementById("chart-date");

  function selectPoint(index) {
    const selectedIndex = Math.max(0, Math.min(index, scaled.length - 1));
    const p = scaled[selectedIndex];
    const firstValue = scaled[0].net_worth;
    const change = p.net_worth - firstValue;
    const pct = firstValue ? (change / firstValue) * 100 : 0;
    const isDown = change < 0;
    activeLine.setAttribute("d", pathFor(scaled.slice(0, selectedIndex + 1)));
    futureLine.setAttribute("d", selectedIndex < scaled.length - 1 ? pathFor(scaled.slice(selectedIndex)) : "");
    marker.setAttribute("x1", p.x);
    marker.setAttribute("x2", p.x);
    dot.setAttribute("cx", p.x);
    dot.setAttribute("cy", p.y);
    valueEl.textContent = fmt(p.net_worth);
    changeEl.classList.toggle("down", isDown);
    changeEl.textContent = `${isDown ? "↘" : "↗"} ${Math.abs(pct).toFixed(2)}%`;
    dateEl.textContent = fmtDate(p.date);
  }

  function indexFromClientX(clientX) {
    const rect = svg.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * width;
    let bestIndex = 0;
    let bestDistance = Infinity;
    scaled.forEach((p, i) => {
      const distance = Math.abs(p.x - x);
      if (distance < bestDistance) {
        bestDistance = distance;
        bestIndex = i;
      }
    });
    return bestIndex;
  }

  svg.addEventListener("pointerdown", (event) => {
    svg.setPointerCapture(event.pointerId);
    selectPoint(indexFromClientX(event.clientX));
  });
  svg.addEventListener("pointermove", (event) => {
    if (event.buttons || event.pointerType === "mouse") {
      selectPoint(indexFromClientX(event.clientX));
    }
  });
  chartEl.querySelectorAll("[data-chart-range]").forEach(button => {
    button.addEventListener("click", () => {
      chartRange = button.dataset.chartRange;
      renderNetWorthChart(chartHistory);
    });
  });

  selectPoint(scaled.length - 1);
}

async function addPlaid() {
  const r = await fetch("/api/create_link_token", { method: "POST" });
  const data = await r.json();
  if (!data.link_token) {
    out.innerHTML = `<pre class="err">${JSON.stringify(data, null, 2)}</pre>`;
    return;
  }
  const handler = Plaid.create({
    token: data.link_token,
    onSuccess: async (public_token) => {
      await fetch("/api/set_access_token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ public_token }),
      });
      await refresh(true);
    },
    onExit: (err) => {
      if (err) out.innerHTML = `<pre class="err">${JSON.stringify(err, null, 2)}</pre>`;
    },
  });
  handler.open();
}

async function enablePlaidInvestments() {
  const itemsPayload = await fetch("/api/plaid/items").then(r => r.json());
  const items = itemsPayload.items || [];
  if (!items.length) {
    out.innerHTML = `<pre class="err">No Plaid connections found.</pre>`;
    return;
  }

  let item = items[0];
  if (items.length > 1) {
    const menu = items
      .map((entry, index) => `${index + 1}. ${entry.institution_name || "Plaid item"}`)
      .join("\n");
    const choice = prompt(`Pick a Plaid connection to grant Investments consent:\n\n${menu}`, "1");
    if (choice == null) return;
    const index = Number(choice) - 1;
    if (!Number.isInteger(index) || !items[index]) {
      out.innerHTML = `<pre class="err">Invalid selection.</pre>`;
      return;
    }
    item = items[index];
  }

  const r = await fetch("/api/create_update_link_token", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ item_id: item.item_id }),
  });
  const data = await r.json();
  if (!data.link_token) {
    out.innerHTML = `<pre class="err">${JSON.stringify(data, null, 2)}</pre>`;
    return;
  }

  const handler = Plaid.create({
    token: data.link_token,
    onSuccess: async () => {
      await refreshInvestments(true);
      showView("investments");
    },
    onExit: (err) => {
      if (err) out.innerHTML = `<pre class="err">${JSON.stringify(err, null, 2)}</pre>`;
    },
  });
  handler.open();
}

async function addSnapTrade() {
  const r = await fetch("/api/snaptrade/connect", { method: "POST" });
  const data = await r.json();
  if (!data.redirect_uri) {
    out.innerHTML = `<pre class="err">${JSON.stringify(data, null, 2)}</pre>`;
    return;
  }
  const w = window.open(
    data.redirect_uri,
    "snaptrade_portal",
    "width=520,height=720"
  );
  // Poll for popup close, then refresh.
  const timer = setInterval(() => {
    if (!w || w.closed) {
      clearInterval(timer);
      refresh(true);
    }
  }, 600);
}

async function refresh(force = false) {
  const path = force ? "/api/balances?refresh=1" : "/api/balances";
  const bal = await fetch(path).then(r => r.json());

  if (bal.error) {
    out.innerHTML = `<pre class="err">${JSON.stringify(bal, null, 2)}</pre>`;
    return;
  }

  renderNetWorthChart(bal.history);

  const allAccts = Object.values(bal.groups).flat();
  const instNames = [...new Set(allAccts.map(a => a.institution))];
  const fresh = freshness(bal);
  const hiddenNote = bal.hidden_account_count
    ? ` ${bal.hidden_account_count} hidden.`
    : "";
  instEl.textContent = instNames.length
    ? `Connected (${instNames.length}): ${instNames.join(", ")}. ${fresh}${hiddenNote}`
    : bal.hidden_account_count
      ? `No visible accounts. ${fresh}${hiddenNote}`
      : `No accounts connected yet. ${fresh}`;

  if (!allAccts.length) {
    out.innerHTML = (bal.errors || []).length
      ? `<pre class="err">${JSON.stringify(bal.errors, null, 2)}</pre>`
      : "";
    return;
  }

  const cats = [
    { key: "deposit",    label: "Deposit  (checking / savings)" },
    { key: "investment", label: "Investment" },
    { key: "debt",       label: "Debt  (credit cards / loans)" },
  ];
  if ((bal.groups.other || []).length) cats.push({ key: "other", label: "Other" });

  let html = "";
  for (const { key, label } of cats) {
    const accounts = bal.groups[key] || [];
    const rows = (bal.groups[key] || []).map(a => {
      const tag = a.source === "snaptrade"
        ? `<span class="tag snaptrade">SnapTrade</span>`
        : `<span class="tag">Plaid</span>`;
      const remove = removeMode && a.account_key
        ? `<button class="remove" data-hide-account="${a.account_key}">Remove</button>`
        : "";
      return `
        <tr>
          <td data-label="Institution">${a.institution}${tag}</td>
          <td data-label="Account">${a.name}${a.mask ? ` <span class="muted">…${a.mask}</span>` : ""}</td>
          <td data-label="Subtype">${a.subtype || a.type}</td>
          <td data-label="Balance" class="num">${fmt(a.current)}</td>
          ${removeMode ? `<td data-label="" class="actions">${remove}</td>` : ""}
        </tr>`;
    }).join("");
    const actionHeader = removeMode ? `<th class="actions"></th>` : "";
    const cls = key === "debt" ? "subtotal debt" : "subtotal";
    const openAttr = openCategories.has(key) ? " open" : "";
    const countLabel = `${accounts.length} account${accounts.length === 1 ? "" : "s"}`;
    html += `
      <details class="category" data-category="${key}"${openAttr}>
        <summary>
          <span class="category-main">
            <span class="category-name">${label}</span>
            <span class="category-count">${countLabel}</span>
          </span>
          <span class="${cls}">${fmt(bal.totals[key] || 0)}</span>
          <span class="category-chevron" aria-hidden="true"></span>
        </summary>
        <div class="category-body">
          ${rows
            ? `<table>
                <thead><tr><th>Institution</th><th>Account</th><th>Subtype</th><th class="num">Balance</th>${actionHeader}</tr></thead>
                <tbody>${rows}</tbody>
               </table>`
            : `<p class="muted">None.</p>`}
        </div>
      </details>`;
  }

  html += `
    <div class="networth">
      <span>Net worth <span class="muted">(deposit + investment − debt)</span></span>
      <span class="amount">${fmt(bal.net_worth)}</span>
    </div>`;

  if ((bal.errors || []).length) {
    html += `<pre class="err">${JSON.stringify(bal.errors, null, 2)}</pre>`;
  }

  out.innerHTML = html;
}

async function hideAccount(accountKey) {
  if (!confirm("Remove this account from Forge Ledger?")) return;
  const r = await fetch("/api/accounts/hide", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ account_key: accountKey }),
  });
  const data = await r.json();
  if (!r.ok) {
    out.innerHTML = `<pre class="err">${JSON.stringify(data, null, 2)}</pre>`;
    return;
  }
  await refresh();
}

async function resetAll() {
  if (!confirm("Unlink all accounts locally? (Plaid and SnapTrade connections remain on their side.)")) return;
  await fetch("/api/reset", { method: "POST" });
  transactionsData = [];
  investmentsData = null;
  txSearch.value = "";
  await refresh();
  if (currentView === "transactions") await refreshTransactions();
  if (currentView === "investments") await refreshInvestments();
}

  hideAccount(button.dataset.hideAccount);
});

out.addEventListener("toggle", (event) => {
  const details = event.target;
  if (!(details instanceof HTMLDetailsElement) || !details.dataset.category) return;
  if (details.open) {
    openCategories.add(details.dataset.category);
  } else {
    openCategories.delete(details.dataset.category);
  }
}, true);

document.addEventListener("click", (event) => {
  if (!(event.target instanceof Element) || !actionsMenu.open) return;
  if (!actionsMenu.contains(event.target)) actionsMenu.open = false;
});

document.getElementById("add-plaid").onclick = addPlaid;
document.getElementById("add-snaptrade").onclick = addSnapTrade;
document.getElementById("plaid-investments").onclick = enablePlaidInvestments;
document.getElementById("refresh").onclick = () => {
  if (currentView === "transactions") {
    refreshTransactions(true);
  } else if (currentView === "investments") {
    refreshInvestments(true);
  } else {
    refresh(true);
  }
};
removeModeBtn.onclick = () => {
  removeMode = !removeMode;
  removeModeBtn.textContent = removeMode ? "Done" : "Remove";
  refresh();
};
document.getElementById("reset").onclick = resetAll;
overviewTab.onclick = () => showView("overview");
investmentsTab.onclick = () => showView("investments");
transactionsTab.onclick = () => showView("transactions");
txSearch.addEventListener("input", renderTransactions);

refresh();
</script>
</body>
</html>
